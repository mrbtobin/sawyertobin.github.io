<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}/* Layout: one-column mobile app; wide screens split map | panel. Look: black field, white type, one electric-lime accent; Manrope + Space Mono labels. */
:root {
  --bg: #000000; --paper: #0d0d0b; --ink: #ffffff; --ink-2: #a3a39c; --rule: #32332b; --grid: #121210;
  --copper: #e1ff29; --lime: #e1ff29; --on-lime: #000000; --blue: #7aa7ff; --teal: #2fe0d0; --violet: #b89cff; --ok: #1aff71; --warn: #e0ff29; --bad: #ff4066; --pass: #1aff71; --fail: #ff4066;
  --plan: #2c8bff; --plan-edge: #24bcff; --manage: #c169ff; --operate: #09ffa6; --lime-ink: #e1ff29; --plan-bg: #141940; --manage-bg: #1a1620; --operate-bg: #12241e; --lime-bg: #1c2008;
  --streak: 255,255,255;
  --c-sun: #e1ff29; --c-metro: #9d8cff; --c-wind: #2fe0d0; --c-iso: #a3a39c; --chip: #1b1c17;
  --shadow: 0 0 0 1px rgba(255,255,255,.02), 0 18px 40px -24px rgba(0,0,0,.9);
  --h-1: #3a3b33; --h-2: #2a2b24; --h-3: #1d1e19; --h-edge: #55574b; --h-line: #a3a39c; --h-solar: #7aa7ff; --h-screen: #2fe0d0;
  --h-1: #2f2f2b; --h-2: #1c1c19; --h-3: #121210; --h-edge: #45463d; --h-w1: #f2f2ee; --h-w2: #cfcfc8; --h-tile: #121210; --h-tile-side: #070706; --h-tile-edge: #2c2d26; --h-rim: #e1ff29;
  --h-hub: #1a1f05; --h-hubedge: #e1ff29; --h-flow: #e1ff29; --h-flow2: #2fe0d0; --h-spoke: #3a3b33;
  color-scheme: dark;
  --f-display: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "Space Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #ffffff; --paper: #f6f6f3; --ink: #000000; --ink-2: #5b5c53; --rule: #e5e7eb; --grid: #f3f3ef;
  --copper: #5f6f00; --lime: #e1ff29; --on-lime: #000000; --blue: #2457c5; --teal: #0d8f84; --violet: #6a4fd1; --ok: #0f9e47; --warn: #8fa300; --bad: #df2a50; --pass: #0f9e47; --fail: #df2a50;
  --plan: #1766d6; --plan-edge: #0e8fd1; --manage: #8b3fd9; --operate: #00976a; --lime-ink: #5f6f00; --plan-bg: #eef3ff; --manage-bg: #f6efff; --operate-bg: #eafaf3; --lime-bg: #f8ffd6;
  --streak: 0,0,0;
  --c-sun: #7f9600; --c-metro: #5b48d6; --c-wind: #0d8f84; --c-iso: #5b5c53; --chip: #ececE6;
  --shadow: 0 1px 0 rgba(0,0,0,.04), 0 14px 30px -22px rgba(0,0,0,.35);
  --h-1: #ffffff; --h-2: #e7e8e1; --h-3: #cfd1c6; --h-edge: #a7a99c; --h-line: #5b5c53; --h-solar: #2457c5; --h-screen: #8fe7de;
  --h-w1: #ffffff; --h-w2: #e2e3dc; --h-tile: #f4f4ef; --h-tile-side: #dfe0d8; --h-tile-edge: #c9cbbf; --h-rim: #9bb800;
  --h-hub: #f2ffb0; --h-hubedge: #8aa300; --h-flow: #7f9600; --h-flow2: #0d8f84; --h-spoke: #d7d9ce;
  color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #ffffff; --paper: #f6f6f3; --ink: #000000; --ink-2: #5b5c53; --rule: #e5e7eb; --grid: #f3f3ef;
  --copper: #5f6f00; --lime: #e1ff29; --on-lime: #000000; --blue: #2457c5; --teal: #0d8f84; --violet: #6a4fd1; --ok: #0f9e47; --warn: #8fa300; --bad: #df2a50; --pass: #0f9e47; --fail: #df2a50;
  --plan: #1766d6; --plan-edge: #0e8fd1; --manage: #8b3fd9; --operate: #00976a; --lime-ink: #5f6f00; --plan-bg: #eef3ff; --manage-bg: #f6efff; --operate-bg: #eafaf3; --lime-bg: #f8ffd6;
  --streak: 0,0,0;
  --c-sun: #7f9600; --c-metro: #5b48d6; --c-wind: #0d8f84; --c-iso: #5b5c53; --chip: #ececE6;
  --shadow: 0 1px 0 rgba(0,0,0,.04), 0 14px 30px -22px rgba(0,0,0,.35);
  --h-1: #ffffff; --h-2: #e7e8e1; --h-3: #cfd1c6; --h-edge: #a7a99c; --h-line: #5b5c53; --h-solar: #2457c5; --h-screen: #8fe7de;
  --h-w1: #ffffff; --h-w2: #e2e3dc; --h-tile: #f4f4ef; --h-tile-side: #dfe0d8; --h-tile-edge: #c9cbbf; --h-rim: #9bb800;
  --h-hub: #f2ffb0; --h-hubedge: #8aa300; --h-flow: #7f9600; --h-flow2: #0d8f84; --h-spoke: #d7d9ce;
  color-scheme: light; }

html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  background-image: radial-gradient(var(--grid) 1px, transparent 1.4px);
  background-size: 24px 24px; -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--rule); }
.top-in { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 10px; min-height: 52px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { font-family: var(--f-display); font-weight: 800; font-size: 22px; letter-spacing: .02em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 0; }
.brand svg { width: 22px; height: 22px; }
.top .sp { flex: 1; }
.iconbtn { border: 1px solid var(--rule); background: var(--paper); border-radius: 8px; min-width: 38px; height: 38px; padding: 0 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; }
.iconbtn:hover { border-color: var(--ink-2); }

h1, h2, h3 { font-family: var(--f-display); text-transform: uppercase; letter-spacing: .01em; line-height: 1.02; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(32px, 8vw, 72px); font-weight: 800; overflow-wrap: anywhere; }
h2 { font-size: 30px; font-weight: 800; }
h3 { font-size: 21px; font-weight: 700; }
.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
.muted { color: var(--ink-2); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
p { margin: 0; max-width: 65ch; }

/* home */
.hero { padding-block: 28px 18px; display: grid; gap: 14px; }
.hero h1 span { color: var(--copper); }
.hero p { font-size: 17px; }
.disclaim { font-size: 12px; color: var(--ink-2); border-left: 2px solid var(--rule); padding-left: 10px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-top: 8px; }
.tile { text-align: left; background: var(--paper); border: 1px solid var(--rule); border-radius: 12px; padding: 16px; display: grid; gap: 8px; box-shadow: var(--shadow); min-width: 0; }
.tile:hover { border-color: var(--ink-2); }
.tile .k { font-family: var(--f-mono); font-size: 11px; color: var(--copper); letter-spacing: .1em; text-transform: uppercase; }
.tile h3 { font-size: 26px; }
.tile.lab { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.tile.lab .k { color: var(--c-sun); }
.tile.lab .muted { color: color-mix(in srgb, var(--paper) 72%, transparent); }
.bar { height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ok); width: 0; transition: width .4s; }

/* deck list */
.section-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding-block: 22px 12px; }
.decks { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
.deck { text-align: left; background: var(--paper); border: 1px solid var(--rule); border-radius: 12px; padding: 14px 14px 12px; display: grid; gap: 6px; position: relative; overflow: hidden; min-width: 0; }
.deck::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--dc); }
.deck .row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.deck:hover { border-color: var(--ink-2); }

/* flashcards */
.fc-wrap { display: grid; gap: 14px; max-width: 640px; margin: 0 auto; padding-top: 18px; }
.fc-meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.card { background: var(--paper); border: 1px solid var(--rule); border-radius: 16px; min-height: 290px; padding: 22px; display: grid; align-content: center; gap: 12px; box-shadow: var(--shadow); text-align: left; width: 100%; position: relative; }
.card .term { font-family: var(--f-display); font-size: clamp(32px, 7vw, 46px); font-weight: 800; text-transform: uppercase; line-height: 1; }
.card .def { font-size: 17px; }
.card .note { font-size: 14px; color: var(--copper); border-top: 1px dashed var(--rule); padding-top: 10px; }
.card .hint { position: absolute; right: 14px; bottom: 10px; font-family: var(--f-mono); font-size: 11px; color: var(--ink-2); }
.btnrow { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { border: 1px solid var(--ink); background: var(--ink); color: var(--paper); border-radius: 10px; padding: 11px 16px; font-weight: 600; min-height: 44px; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--rule); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.warnb { background: transparent; border-color: var(--warn); color: var(--warn); }
.btn.danger { background: transparent; border-color: var(--bad); color: var(--bad); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.grow { flex: 1; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; }
.toggle input { width: 18px; height: 18px; accent-color: var(--ok); }

/* quiz */
.q-opts { display: grid; gap: 8px; }
.q-opt { text-align: left; border: 1px solid var(--rule); background: var(--paper); border-radius: 10px; padding: 12px 14px; min-height: 48px; }
.q-opt:hover:not(:disabled) { border-color: var(--ink-2); }
.q-opt.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, var(--paper)); }
.q-opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--paper)); }
.q-prompt { font-size: 18px; }
.q-prompt.big { font-family: var(--f-display); font-size: 34px; font-weight: 800; text-transform: uppercase; line-height: 1.02; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chipbtn { border: 1px solid var(--rule); background: var(--paper); border-radius: 999px; padding: 6px 12px; font-size: 13px; min-height: 34px; }
.chipbtn.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* prep */
.prep { display: grid; gap: 10px; max-width: 760px; }
details.pq { background: var(--paper); border: 1px solid var(--rule); border-radius: 12px; padding: 0; }
details.pq summary { cursor: pointer; list-style: none; padding: 14px 16px; font-weight: 700; display: flex; justify-content: space-between; gap: 10px; }
details.pq summary::after { content: "+"; font-family: var(--f-mono); color: var(--ink-2); }
details.pq[open] summary::after { content: "\2212"; }
details.pq div { padding: 0 16px 16px; }

/* ===== lab ===== */
.levels { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; }
.lvl { text-align: left; background: var(--paper); border: 1px solid var(--rule); border-radius: 12px; padding: 16px; display: grid; gap: 8px; min-width: 0; }
.lvl:hover { border-color: var(--ink-2); }
.lvl .n { font-family: var(--f-display); font-size: 54px; font-weight: 800; line-height: .9; color: var(--copper); }
.stars { font-family: var(--f-mono); letter-spacing: 2px; color: var(--warn); }
.howto { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-top: 14px; }
.howto > div { border-top: 2px solid var(--ink); padding-top: 8px; font-size: 14px; }
.howto b { display: block; font-family: var(--f-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 2px; }

.game { display: grid; gap: 12px; padding-top: 12px; }
.ghead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ghead .ttl { flex: 1; min-width: 0; }
.ghead h3 { font-size: clamp(17px, 4.6vw, 22px); }
.clock { font-family: var(--f-mono); font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; padding: 4px 10px; border-radius: 8px; background: var(--paper); border: 1px solid var(--rule); }
.clock.low { color: var(--bad); border-color: var(--bad); }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.tab { flex: 0 0 auto; border: 1px solid var(--rule); background: var(--paper); border-radius: 10px; padding: 7px 12px 7px 10px; display: flex; align-items: center; gap: 8px; min-height: 44px; font-weight: 600; font-size: 14px; }
.tab .sw { width: 10px; height: 10px; border-radius: 3px; background: var(--tc); flex: none; }
.tab .st { font-family: var(--f-mono); font-size: 10px; font-weight: 500; color: var(--ink-2); letter-spacing: .04em; text-transform: uppercase; }
.tab.on { border-color: var(--tc); box-shadow: inset 0 -3px 0 var(--tc); }
.tab .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dc, var(--rule)); }
.split { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 920px) { .split { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; } .mapbox { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); } }
.mapbox { background: var(--paper); border: 1px solid var(--rule); border-radius: 14px; overflow: hidden; min-width: 0; }
.maphead { display: flex; gap: 8px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
.maphead .who { font-weight: 700; display: flex; align-items: center; gap: 6px; flex: 1; min-width: 120px; font-size: 14px; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 6px 10px; font-size: 12px; font-weight: 600; min-height: 34px; }
.seg button.on { background: var(--ink); color: var(--paper); }
svg.map { display: block; width: 100%; height: auto; touch-action: manipulation; user-select: none; }
.map .ln { fill: none; stroke-linecap: round; }
.map .hit { stroke: transparent; stroke-width: 22; fill: none; cursor: pointer; }
.map .flow { fill: none; stroke-dasharray: 2 10; stroke-linecap: round; animation: flow linear infinite; opacity: .9; pointer-events: none; }
@keyframes flow { to { stroke-dashoffset: -24; } }
@media (prefers-reduced-motion: reduce) { .map .flow { animation: none; } }
.map .bus { cursor: pointer; }
.map text { font-family: var(--f-mono); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; padding: 8px 12px 10px; font-size: 11px; color: var(--ink-2); font-family: var(--f-mono); border-top: 1px solid var(--rule); }
.legend i { display: inline-block; width: 16px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
.metrics { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); border-top: 1px solid var(--rule); }
.metrics > div { padding: 8px 10px; border-right: 1px solid var(--rule); min-width: 0; }
.metrics > div:last-child { border-right: 0; }
.metrics b { display: block; font-family: var(--f-mono); font-size: 16px; font-variant-numeric: tabular-nums; }
.metrics span { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }

.panel { display: grid; gap: 10px; min-width: 0; }
.box { background: var(--paper); border: 1px solid var(--rule); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; min-width: 0; }
.box h4 { margin: 0; font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
.brief { border-left: 4px solid var(--tc); }
.budget { display: grid; gap: 4px; }
.budget .bar > i { background: var(--tc); }
.budget .bar.over > i { background: var(--bad); }
.diff { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; font-family: var(--f-mono); font-size: 12.5px; }
.diff li { display: flex; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 6px; background: var(--chip); min-width: 0; }
.diff li .tx { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.diff li.add { box-shadow: inset 3px 0 0 var(--ok); }
.diff li.mod { box-shadow: inset 3px 0 0 var(--warn); }
.diff li.del { box-shadow: inset 3px 0 0 var(--bad); }
.diff li .x { border: 0; background: transparent; color: var(--ink-2); padding: 2px 6px; font-size: 16px; line-height: 1; min-height: 28px; }
.diff li .c { color: var(--ink-2); white-space: nowrap; }
.checks { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; font-size: 13.5px; }
.checks li { display: grid; grid-template-columns: 20px 1fr; gap: 6px; align-items: start; }
.checks .ic { font-family: var(--f-mono); font-weight: 700; }
.checks .pass .ic { color: var(--ok); } .checks .fail .ic { color: var(--bad); } .checks .wait .ic { color: var(--warn); }
.viol { margin: 2px 0 0; padding-left: 16px; font-size: 12.5px; color: var(--ink-2); }
.viol li { display: list-item; }
.issue { border: 1px dashed var(--warn); border-radius: 10px; padding: 10px; display: grid; gap: 8px; font-size: 13.5px; background: color-mix(in srgb, var(--warn) 8%, var(--paper)); }
.cof { display: flex; gap: 8px; align-items: center; font-size: 13px; flex-wrap: wrap; }
.cof .tx { flex: 1; min-width: 160px; }
.small { font-size: 12.5px; }
.log { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; font-size: 13px; max-height: 260px; overflow: auto; }
.log li { display: grid; grid-template-columns: auto 1fr; gap: 8px; }
.log .v { font-family: var(--f-mono); font-size: 11px; padding: 2px 6px; border-radius: 4px; background: var(--chip); color: var(--ink); height: fit-content; }

/* sheets / modals */
.scrim { position: fixed; inset: 0; background: rgba(8,14,22,.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
@media (min-width: 720px) { .scrim { align-items: center; } }
.sheet { background: var(--paper); color: var(--ink); width: min(560px, 100%); max-height: 86vh; overflow: auto; border-radius: 16px 16px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 12px; box-shadow: var(--shadow); }
@media (min-width: 720px) { .sheet { border-radius: 16px; padding: 22px; } }
.sheet .opt { text-align: left; border: 1px solid var(--rule); background: var(--bg); border-radius: 10px; padding: 12px; display: grid; gap: 2px; min-height: 48px; }
.sheet .opt:hover:not(:disabled) { border-color: var(--ink-2); }
.sheet .opt b { display: flex; justify-content: space-between; gap: 8px; }
.sheet .opt:disabled { opacity: .5; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 13.5px; }

<script>// ===== Grid Lab engine: tiny DC power flow + N-1 + git-style model versioning =====
const ENGINE = (() => {
  // Map coordinates are in a 400x300 viewBox
  const BUSES = [
    { id: 1, name: 'North Hydro', short: 'HYD', x: 50,  y: 48,  lab: [-10, 28, 'start', 1],  load: 0,   gens: [{ type: 'hydro', mw: 380 }] },
    { id: 2, name: 'Ridge',       short: 'RDG', x: 200, y: 42,  lab: [14, -6, 'start', -1], load: 30,  gens: [] },
    { id: 3, name: 'Desert Flats',short: 'DSF', x: 352, y: 58,  lab: [10, 28, 'end', 1],  load: 0,   gens: [] },
    { id: 4, name: 'Central',     short: 'CEN', x: 112, y: 160, lab: [-14, 4, 'end', 1], load: 60,  gens: [] },
    { id: 5, name: 'Metro',       short: 'MET', x: 252, y: 160, lab: [16, 4, 'start', 1], load: 430, gens: [] },
    { id: 6, name: 'Port',        short: 'PRT', x: 50,  y: 278, lab: [-10, 26, 'start', 1], load: 20,  gens: [{ type: 'gas', mw: 400 }] },
    { id: 7, name: 'Valley',      short: 'VAL', x: 196, y: 288, lab: [0, 26, "middle", 1], load: 140, gens: [] },

  ];
  // x = reactance (relative); rating = MW (normal). length km.
  const LINES = [
    { id: 'L1',  a: 1, b: 2, x: 0.10, rating: 350, km: 75 },
    { id: 'L2',  a: 1, b: 4, x: 0.10, rating: 350, km: 60 },

    { id: 'L5',  a: 4, b: 5, x: 0.08, rating: 360, km: 60 },
    { id: 'L6',  a: 4, b: 6, x: 0.10, rating: 300, km: 65 },
    { id: 'L7',  a: 6, b: 7, x: 0.10, rating: 310, km: 70 },

    night: { name: 'Windy spring night · 3 am', short: 'night', load: 0.5, flatLoad: 0.95, solar: 0.0, wind: 0.95, batt: -1, dlr: 1.15, hydroMax: 0.6 },

  const LTE = 1.15; // long-term emergency rating multiplier during contingencies
  const CO2 = { gas: 0.4 }; // t/MWh

  const clone = (o) => JSON.parse(JSON.stringify(o));
  function baseModel() {

  }

// ===== Electron streaks: each starts as a dot, accelerates along its line and stretches into a head with a fading tail =====
const FLOW = (() => {
  const layers = new Set();
  const reduced = () => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };
  let running = false;
  // spec: { x1, y1, x2, y2, rate (0..1 how busy), seed }
  function attach(svgEl, specs, opts = {}) {
    if (!svgEl || reduced()) return null;
    const host = svgEl.parentElement;
    host.style.position = 'relative';
    const cv = document.createElement('canvas');
    cv.className = 'flowc';
    cv.setAttribute('aria-hidden', 'true');
    host.appendChild(cv);
    const vb = svgEl.viewBox.baseVal;
    const parts = [];
    specs.forEach((sp, i) => {
      const len = Math.hypot(sp.x2 - sp.x1, sp.y2 - sp.y1);
      const n = sp.rate > 0.6 ? 2 : 1;
      for (let k = 0; k < n; k++) {
        const r = rnd(sp.seed * 13 + k * 7 + i);
        parts.push({ sp, len, dur: (opts.dur || 1.6) * (1.25 - 0.55 * sp.rate) * (0.85 + 0.3 * r), gap: (opts.gap || 1.2) * (0.4 + r) * (1.4 - sp.rate), start: performance.now() / 1000 - r * 3 - k * 1.1 });
      }
    });
    const L = { svgEl, cv, vb, parts, opts };
    layers.add(L);
    if (!running) { running = true; requestAnimationFrame(frame); }
    return L;
  }
  function rnd(x) { const s = Math.sin(x * 12.9898) * 43758.5453; return s - Math.floor(s); }
  function color() { const v = getComputedStyle(document.documentElement).getPropertyValue('--streak').trim(); return v || '255,255,255'; }
  function frame() {
    const now = performance.now() / 1000;
    const rgb = color();
    layers.forEach((L) => {
      if (!document.body.contains(L.svgEl)) { layers.delete(L); return; }
      const rect = L.svgEl.getBoundingClientRect();
      if (!rect.width) return;
      if (L.opts.hide && L.opts.hide(L.svgEl)) { L.cv.getContext('2d').clearRect(0, 0, L.cv.width, L.cv.height); return; }
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const W = Math.round(rect.width * dpr), H = Math.round(rect.height * dpr);
      if (L.cv.width !== W || L.cv.height !== H) { L.cv.width = W; L.cv.height = H; L.cv.style.width = rect.width + 'px'; L.cv.style.height = rect.height + 'px'; }
      const ctx = L.cv.getContext('2d');
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H);
      const s = (rect.width / L.vb.width) * dpr;
      ctx.setTransform(s, 0, 0, s, -L.vb.x * s, -L.vb.y * s);
      ctx.lineCap = 'round';
      ctx.save();
      if (L.opts.holes && L.opts.holes.length) { // streaks pass *under* labels and substations
        ctx.beginPath(); ctx.rect(L.vb.x, L.vb.y, L.vb.width, L.vb.height);
        L.opts.holes.forEach(([x, y, w, h]) => ctx.rect(x, y, w, h));
        ctx.clip('evenodd');
      }
      L.parts.forEach((p) => {
        const cyc = p.dur + p.gap; let t = ((now - p.start) % cyc + cyc) % cyc;
        if (t > p.dur) return; t /= p.dur;
        const { x1, y1, x2, y2 } = p.sp; const ux = (x2 - x1) / p.len, uy = (y2 - y1) / p.len;
        // accelerate: distance grows with t^2.4, so speed (and the tail) grows from zero
        const e = 2.4; const d = p.len * Math.pow(t, e); const v = e * Math.pow(t, e - 1);
        const tail = Math.min(L.opts.maxTail || 46, v * p.len * 0.16);
        const fadeIn = Math.min(1, t / 0.12), fadeOut = t > 0.82 ? Math.max(0, 1 - (t - 0.82) / 0.18) : 1;
        const a = fadeIn * fadeOut;
        const hx = x1 + ux * d, hy = y1 + uy * d;
        if (tail < 1.2) { // still a dot, gathering itself
          ctx.fillStyle = `rgba(${rgb},${0.9 * a})`; ctx.beginPath(); ctx.arc(hx, hy, 1.1, 0, Math.PI * 2); ctx.fill(); return;
        }
        const tx = hx - ux * tail, ty = hy - uy * tail;
        const g = ctx.createLinearGradient(tx, ty, hx, hy);
        g.addColorStop(0, `rgba(${rgb},0)`); g.addColorStop(0.7, `rgba(${rgb},${0.45 * a})`); g.addColorStop(1, `rgba(${rgb},${0.95 * a})`);
        ctx.strokeStyle = g; ctx.lineWidth = L.opts.width || 1.3;
        ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(hx, hy); ctx.stroke();
        ctx.fillStyle = `rgba(${rgb},${a})`; ctx.beginPath(); ctx.arc(hx, hy, (L.opts.width || 1.3) * 0.75, 0, Math.PI * 2); ctx.fill();
      });
      ctx.restore();
    });
    if (layers.size) requestAnimationFrame(frame); else running = false;
  }
  return { attach };
})();

function quiz(deckId) {
  const pool = deckId ? DECKS.find((d) => d.id === deckId).cards.map((c, i) => ({ ...c, deck: deckId, i })) : allCards();
  let qs = [], n = 0, right = 0, answered = false;
  function setup() {
    app.innerHTML = `<div class="wrap"><div class="fc-wrap">
      <button class="iconbtn" data-go="home" style="justify-self:start">← Home</button>
      <h2>Quiz</h2><p class="muted">Pick a deck, or mix them all. Ten questions.</p>
      <div class="chips">${[{ id: '', name: 'Mixed' }, ...DECKS].map((d) => `<button class="chipbtn ${((deckId || '') === d.id) ? 'on' : ''}" data-go="${d.id ? 'quiz-' + d.id : 'quiz'}">${esc(d.name)}${best['quiz-' + (d.id || 'mixed')] != null ? ' · best ' + best['quiz-' + (d.id || 'mixed')] + '/10' : ''}</button>`).join('')}</div>
      <button class="btn" id="start">Start ${deckId ? esc(DECKS.find((d) => d.id === deckId).name) : 'mixed'} quiz</button>
    </div></div>`;
    $('#start').onclick = start;
  }
  function start() {
    qs = shuffle(pool).slice(0, 10).map((c) => {
      const sameDeck = allCards().filter((x) => x.deck === c.deck && x.t !== c.t);
      const others = shuffle(sameDeck).slice(0, 3);
      const mode = Math.random() < 0.6 ? 'def2term' : 'term2def';
      return { c, mode, opts: shuffle([c, ...others]) };
    });
    n = 0; right = 0; ask();
  }
  function ask() {
    answered = false;
    const q = qs[n];
    const prompt = q.mode === 'def2term'
      ? `<span class="eyebrow">Which term matches?</span><p class="q-prompt">${esc(q.c.d)}</p>`
      : `<span class="eyebrow">What does this mean?</span><p class="q-prompt big">${esc(q.c.t)}</p>`;
    app.innerHTML = `<div class="wrap"><div class="fc-wrap">
      <div class="fc-meta"><button class="iconbtn" data-go="quiz">← Quiz menu</button><span class="eyebrow mono">Q${n + 1}/10 · ${right} right</span></div>
      <div class="bar"><i style="width:${n * 10}%"></i></div>
      <div class="card" style="min-height:0">${prompt}</div>
      <div class="q-opts">${q.opts.map((o, i) => `<button class="q-opt" data-i="${i}">${esc(q.mode === 'def2term' ? o.t : o.d)}</button>`).join('')}</div>
      <div id="fb"></div>
    </div></div>`;
    app.querySelectorAll('.q-opt').forEach((b) => (b.onclick = () => pick(+b.dataset.i)));
  }
  function pick(i) {
    if (answered) return; answered = true;
    const q = qs[n]; const ok = q.opts[i] === q.c; if (ok) right++;
    app.querySelectorAll('.q-opt').forEach((b, j) => { b.disabled = true; if (q.opts[j] === q.c) b.classList.add('right'); else if (j === i) b.classList.add('wrong'); });
    $('#fb').innerHTML = `<div class="box"><h4>${ok ? '<span class="good">Correct</span>' : '<span class="badc">Not quite</span>'}</h4>
      <p><b>${esc(q.c.t)}</b>: ${esc(q.c.d)}</p>${q.c.n ? `<p class="small" style="color:var(--copper)">${esc(q.c.n)}</p>` : ''}
      <button class="btn" id="next">${n === 9 ? 'See score' : 'Next question'}</button></div>`;
    $('#next').onclick = () => { n++; n < 10 ? ask() : done(); };
    $('#next').focus();
  }
  function done() {
    const key = 'quiz-' + (deckId || 'mixed');
    const isBest = best[key] == null || right > best[key];
    if (isBest) { best[key] = right; saveBest(); }
    app.innerHTML = `<div class="wrap"><div class="fc-wrap"><div class="card">
      <span class="eyebrow">${deckId ? esc(DECKS.find((d) => d.id === deckId).name) : 'Mixed'} quiz</span>
      <span class="term">${right}/10</span>
      <p class="def">${right >= 9 ? 'Ready to talk shop.' : right >= 7 ? 'Solid. Run the cards you missed once more.' : 'Run through the study cards, then try again.'}${isBest ? ' New best.' : ''}</p>
      <div class="btnrow"><button class="btn" id="again">Try again</button><button class="btn ghost" data-go="learn">Study cards</button></div>
    </div></div></div>`;
    $('#again').onclick = start;
  }
  setup();
}

let G = null;

  const mk = (op, owner, locked) => { if (!locked && G) { tried.ops.add(op.op); tried.added = (tried.added || 0) + 1; } return { ...op, id: 'o' + (++uid), owner, locked: !!locked }; };

    baseStudy: null, mk, tried, cluster: false,

  L.companies.forEach((cid) => {

      issue: C.issue ? { text: C.issue.text, state: 'open', until: 0, wait: C.issue.wait } : { state: 'fixed', none: true }, forced: false };
  });
  G.baseStudy = E.study(E.build([]));

  showIntro();
  const tick = setInterval(() => {
    if (!G || G.over || G.paused || document.hidden) return;

    G.events.forEach((ev) => { if (!ev.done && G.t >= ev.at) { ev.done = true; fireEvent(ev); dirty = true; } });
    if (L.timer && G.t >= L.timer) { finish('time'); return; }

}
function fireEvent(ev) {
  if (ev.kind === 'retire') {
    commit('iso', [{ op: 'retire', bus: 6, type: 'gas', mw: ev.mw }], `Grid operator: Port gas retirement (\u2212${ev.mw} MW)`);
    toast(`Main changed: the grid operator retired ${ev.mw} MW at Port. Open branches are now behind.`, 4200);
  }
  if (ev.kind === 'derate') {

    toast(`Main changed: inspection derated ${E.lineLabel(ev.line)} to ${ev.to} MW. Open branches are now behind.`, 4200);

}
const mainOps = (ver = G.main.ver) => G.main.commits.filter((c) => c.ver <= ver).flatMap((c) => c.ops);
// cluster preview: main plus every open branch together, the way a cluster study looks at a batch of projects
function clusterOps(sel) { const open = G.L.companies.filter((c) => !G.br[c].merged); const order = sel !== 'main' && open.includes(sel) ? [...open.filter((c) => c !== sel), sel] : open; return [...mainOps(), ...order.flatMap((c) => G.br[c].ops)]; }
const shownOps = (sel) => (G.cluster ? clusterOps(sel) : viewOps(sel));
function viewOps(sel) { if (sel === 'main') return mainOps(); const b = G.br[sel]; return b.merged ? mainOps() : [...mainOps(b.baseVer), ...b.ops]; }
const studyCache = new Map();
function studyFor(ops) { const k = (G && G.L.playground ? `s${G.sun}w${G.wind}|` : '') + JSON.stringify(ops.map(({ id, owner, locked, ...o }) => o)); if (!studyCache.has(k)) { if (studyCache.size > 300) studyCache.clear(); studyCache.set(k, E.study(E.build(ops))); } return studyCache.get(k); }
function commit(by, ops, msg) { G.main.ver += 1; G.main.commits.push({ ver: G.main.ver, by, ops, msg, t: G.t }); }
function spend(cid) {
  const own = [...G.main.commits.flatMap((c) => c.ops), ...(G.br[cid] && !G.br[cid].merged ? G.br[cid].ops : [])].filter((o) => o.owner === cid).reduce((s, o) => s + E.opCost(o), 0);
  const paid = G.ledger.filter((l) => l.from === cid).reduce((s, l) => s + share(l), 0);
  const got = G.ledger.filter((l) => l.to === cid).reduce((s, l) => s + share(l), 0);
  return own + paid - got;
}
// a shared upgrade's cost splits evenly between its owner and every co-funder
function share(l) { const o = findOp(l.opId); if (!o) return 0; const n = G.ledger.filter((x) => x.opId === l.opId).length; return E.opCost(o) / (n + 1); }
function behind(cid) { const b = G.br[cid]; return !b.merged && b.baseVer < G.main.ver; }
function conflictsFor(cid) {
  const b = G.br[cid]; const newer = G.main.commits.filter((c) => c.ver > b.baseVer && c.by !== cid).flatMap((c) => c.ops);
  const out = [];
  b.ops.forEach((mine) => { const k = E.opKey(mine); if (!k) return; const theirs = newer.find((o) => E.opKey(o) === k); if (theirs) out.push({ mine, theirs }); });
  return out;
}
function checksFor(cid) {
  const b = G.br[cid]; const st = studyFor(viewOps(cid)); const C = CO[cid];
  const phys = st.violations.filter((v) => v.kind === 'overload' && !v.cont || v.kind === 'adequacy');
  const n1 = st.violations.filter((v) => !phys.includes(v));
  const sp = spend(cid);
  return {
    st,
    list: [
      { k: 'data', label: 'Data validation (model import)', ok: b.issue.state === 'fixed' || b.issue.state === 'patched', wait: b.issue.state === 'waiting', note: b.issue.state === 'patched' ? 'patched with a typical value, not verified' : '' },
      { k: 'sync', label: behind(cid) ? `Behind main by ${G.main.ver - b.baseVer} commit${G.main.ver - b.baseVer > 1 ? 's' : ''}` : 'Up to date with main', ok: !behind(cid) },

      { k: 'n1', label: 'N-1: every single-line outage', ok: n1.length === 0, v: n1 },

}
const fmt = (x) => (Math.round(x * 10) / 10).toString();
const busName = (id) => E.BUSES.find((b) => b.id === id).name;
function updateClock() {
  const el = $('#clock'); if (!el || !G) return;

    <div class="split">
      <div class="mapbox">
        <div class="maphead">
          <span class="who"><span class="sw" style="width:10px;height:10px;border-radius:3px;background:${color};display:inline-block"></span>${sel === 'main' ? 'Viewing main' : 'Branch: ' + esc(C.short) + (G.br[sel].merged ? ' (merged)' : '')}</span>
          ${L.playground ? `<div class="seg" role="group" aria-label="Sun level"><span class="seglab">Sun</span>${[0, 1, 2, 3].map((n) => `<button data-sun="${n}" class="${G.sun === n ? 'on' : ''}">${n}</button>`).join('')}</div><div class="seg" role="group" aria-label="Wind level"><span class="seglab">Wind</span>${[0, 1, 2, 3].map((n) => `<button data-wind="${n}" class="${G.wind === n ? 'on' : ''}">${n}</button>`).join('')}</div>` : `<div class="seg" role="group" aria-label="Scenario"><button data-scen="peak" class="${G.scen === 'peak' ? 'on' : ''}">Summer peak</button><button data-scen="night" class="${G.scen === 'night' ? 'on' : ''}">Windy night</button></div>`}
          <div class="seg" role="group" aria-label="Contingency view"><button data-mode="normal" class="${G.mode === 'normal' ? 'on' : ''}">All lines in</button><button data-mode="n1" class="${G.mode === 'n1' ? 'on' : ''}">Worst outage</button></div>
          ${L.companies.length > 1 ? `<div class="seg" role="group" aria-label="Which changes to show"><button data-cl="0" class="${G.cluster ? '' : 'on'}">${sel === 'main' ? 'Main only' : 'This branch'}</button><button data-cl="1" class="${G.cluster ? 'on' : ''}">All open branches</button></div>` : ''}
        </div>
        ${mapSVG(ops, st, sel)}
        <div class="metrics">
          <div><b>${Math.round(m.clean)}</b><span>Clean MW</span></div>
          <div><b>${Math.round(m.gas)}</b><span>Gas MW</span></div>
          <div><b class="${m.curtail > 0.5 ? 'warnc' : ''}">${Math.round(m.curtail)}</b><span>Curtailed</span></div>
          <div><b>${Math.round(m.co2)}</b><span>CO₂ t/h</span></div>
        </div>
        <div class="legend"><span><i style="background:var(--ok)"></i>&lt;80%</span><span><i style="background:var(--warn)"></i>80–100%</span><span><i style="background:var(--bad)"></i>&gt;100% ${G.mode === 'n1' ? 'of emergency limit' : 'of rating'}</span><span><i style="background:var(--ink-2);height:2px"></i>dashed = buildable corridor</span></div>
      </div>
      <div class="panel">${G.cluster ? clusterBox(st) : ''}${sel === 'main' ? mainPanel(studyFor(viewOps('main'))) : branchPanel(sel)}</div>
    </div>
  </div></div>`;
  updateClock();
  FLOW.attach($('svg.map'), flowSpecs, { dur: 1.7, gap: 1.0, maxTail: 48, holes: flowHoles });
  app.querySelectorAll('[data-tab]').forEach((b) => (b.onclick = () => { G.sel = b.dataset.tab; renderGame(); }));
  const setPG = () => { E.setScenarios({ custom: E.customScen(G.sun, G.wind) }); G.tried.views.add('night'); renderGame(); };
  app.querySelectorAll('[data-sun]').forEach((b) => (b.onclick = () => { G.sun = +b.dataset.sun; setPG(); }));
  app.querySelectorAll('[data-wind]').forEach((b) => (b.onclick = () => { G.wind = +b.dataset.wind; setPG(); }));
  app.querySelectorAll('[data-scen]').forEach((b) => (b.onclick = () => { G.scen = b.dataset.scen; G.tried.views.add(G.scen); renderGame(); }));
  app.querySelectorAll('[data-cl]').forEach((b) => (b.onclick = () => { G.cluster = b.dataset.cl === '1'; G.tried.views.add('cluster'); renderGame(); }));
  app.querySelectorAll('[data-mode]').forEach((b) => (b.onclick = () => { G.mode = b.dataset.mode; G.tried.views.add(G.mode); renderGame(); }));
  app.querySelectorAll('[data-line]').forEach((el) => (el.onclick = () => lineSheet(el.dataset.line)));
  app.querySelectorAll('[data-bus]').forEach((el) => { el.onclick = () => busSheet(+el.dataset.bus); el.onkeydown = (e) => { if (e.key === 'Enter') busSheet(+el.dataset.bus); }; });
  const p = $('#pause'); if (p) p.onclick = () => { G.paused = !G.paused; renderGame(); };
  $('#help').onclick = showIntro;
  $('#hint').onclick = showHint;
  $('#restart').onclick = () => {
    const was = G.paused; G.paused = true;
    openSheet(`<span class="eyebrow">Restart level ${G.L.id}</span><h3>Start over?</h3><p class="small">This clears every branch, merge and cost-sharing deal in this run and resets the clock.</p>
      <div class="btnrow"><button class="btn ghost grow" id="rsNo">Keep playing</button><button class="btn danger grow" id="rsYes">Restart level</button></div>`);
    $('#rsNo').onclick = () => { G.paused = was; closeSheet(); };
    $('#rsYes').onclick = () => { closeSheet(); route(); };
  };
  wirePanel();
}

function loadColor(p, lim) { return p > lim ? 'var(--bad)' : p > 0.8 * lim ? 'var(--warn)' : 'var(--ok)'; }
function mapSVG(ops, st, sel) {
  const m = E.build(ops);
  const ownOps = sel !== 'main' && !G.br[sel].merged ? G.br[sel].ops : [];
  const otherOps = G.cluster ? G.L.companies.filter((c) => c !== sel && !G.br[c].merged).flatMap((c) => G.br[c].ops) : [];
  const branchOps = [...ownOps, ...otherOps];
  const colorOf = (list) => { const mine = list.find((o) => o.owner === sel); const o = mine || list[0]; return o && CO[o.owner] ? CO[o.owner].color : 'var(--ink)'; };
  const pendingLines = new Set(branchOps.filter((o) => o.line).map((o) => o.line));
  const pendOps = (lid) => branchOps.filter((o) => o.line === lid).map((o) => o.op);
  const CC = sel !== 'main' ? CO[sel].color : 'var(--ink)';
  const still = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();
  const badges = []; flowSpecs = []; flowHoles = E.BUSES.map((bd) => [bd.x - 12, bd.y - 12, 24, 24]);
  const badge = (x, y, sym, label, bcol = CC) => badges.push(`<g class="pg-badge" aria-hidden="true"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="8.5" fill="${bcol}" stroke="var(--paper)" stroke-width="1.6"/><text x="${x.toFixed(1)}" y="${(y + 4).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="800" fill="var(--paper)">${sym}</text><title>${label}</title></g>`);
  const B = (id) => E.BUSES.find((b) => b.id === id);
  let s = `<svg class="map" viewBox="-4 -16 408 364" role="img" aria-label="Grid map">`;
  // candidate corridors
  E.CORRIDORS.forEach((c) => {
    if (m.lines[c.id]) return; const a = B(c.a), b = B(c.b);
    s += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" class="ln" stroke="var(--ink-2)" stroke-width="1.5" stroke-dasharray="4 5" opacity=".7"/>`;
    s += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" class="hit" data-line="${c.id}"><title>${E.lineLabel(c.id)} corridor</title></line>`;
  });
  Object.values(m.lines).forEach((l) => {
    const a = B(l.a), b = B(l.b);
    const ld = G.mode === 'n1' ? st.worst[G.scen][l.id] : st.loading[G.scen][l.id];
    const lim = G.mode === 'n1' ? E.LTE : 1;
    const pct = ld ? ld.pct : 0;
    const col = loadColor(pct, lim);
    const w = 2 + l.rating / 70;
    const flowMW = st.loading[G.scen][l.id] ? st.loading[G.scen][l.id].mw : 0;
    const [p1, p2] = flowMW >= 0 ? [a, b] : [b, a];
    const pend = pendingLines.has(l.id);
    const lc = pend ? colorOf(branchOps.filter((o) => o.line === l.id)) : CC;
    if (pend) {
      const po = pendOps(l.id);
      const L2 = `x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"`;
      const big = po.includes('upgrade') || po.includes('addLine');
      if (big) { const gw = w + 14; s += `<line ${L2} class="ln pg-glow${l.dlr ? ' pg-glow-dlr' : ''}" stroke="${lc}" stroke-width="${gw}" style="--w0:${gw}px;--w1:${(gw + 2 * 0.1 * gw).toFixed(1)}px"/>`; }
      const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy); let nx = -dy / len, ny = dx / len; if (ny > 0) { nx = -nx; ny = -ny; }
      const mx0 = (a.x + b.x) / 2 + dx / len * 26, my0 = (a.y + b.y) / 2 + dy / len * 26;
      badge(mx0 + nx * 15, my0 + ny * 15, po.includes('addLine') ? '+' : '~', po.includes('addLine') ? 'New line in this branch' : 'Modified line in this branch', lc);
    }
    const bigPend = pend && pendOps(l.id).some((o) => o === 'upgrade' || o === 'addLine');
    if (l.dlr && !bigPend) s += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" class="ln dlr-ring" stroke="${pend ? lc : 'var(--lime)'}" stroke-width="${w + 2}" style="--w0:${(w + 2).toFixed(1)}px;--w1:${(w + 2 * 0.1 * w + 2).toFixed(1)}px"/>`;
    s += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" class="ln" stroke="${col}" stroke-width="${w}"><title>${l.dlr ? 'Dynamic line rating: capacity flexes with the weather' : ''}</title></line>`;
    if (Math.abs(flowMW) > 3) flowSpecs.push({ x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y, rate: Math.min(1, Math.abs(flowMW) / 200), seed: [...l.id].reduce((t, ch) => t + ch.charCodeAt(0), 0) });
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const label = Math.round((G.mode === 'n1' ? pct / E.LTE : pct) * 100) + '%';
    flowHoles.push([mx - 18, my - 9, 36, 17]);
    s += `<rect x="${mx - 17}" y="${my - 8}" width="34" height="15" rx="3" fill="var(--paper)" stroke="${col}" stroke-width="1.2"/><text x="${mx}" y="${my + 3.4}" text-anchor="middle" font-size="9.5" font-weight="600" fill="var(--ink)">${label}</text>`;
    s += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" class="hit" data-line="${l.id}"><title>${E.lineLabel(l.id)}</title></line>`;
  });
  // pending substation changes: battery pulses + badges
  E.BUSES.forEach((bd) => {
    const bo = branchOps.filter((o) => o.bus === bd.id);
    if (!bo.length) return;
    const bc = colorOf(bo);
    const batt = bo.filter((o) => o.op === 'addBatt').reduce((t, o) => t + o.mw, 0);
    if (batt) {
      const n = Math.min(4, Math.round(batt / 100)); const dur = 2.4;
      for (let i = 0; i < n; i++) {
        const begin = (-i * dur / n).toFixed(2);
        s += still
          ? `<circle cx="${bd.x}" cy="${bd.y}" r="${16 + i * 7}" fill="none" stroke="${bc}" stroke-width="2.5" opacity="${0.6 - i * 0.12}"/>`
          : `<circle cx="${bd.x}" cy="${bd.y}" r="14" fill="none" stroke="${bc}" stroke-width="3" class="pg-ring"><animate attributeName="r" values="13;${22 + n * 7}" dur="${dur}s" begin="${begin}s" repeatCount="indefinite"/><animate attributeName="opacity" values=".85;0" dur="${dur}s" begin="${begin}s" repeatCount="indefinite"/><animate attributeName="stroke-width" values="4;1" dur="${dur}s" begin="${begin}s" repeatCount="indefinite"/></circle>`;
      }
      s += `<circle cx="${bd.x}" cy="${bd.y}" r="15" fill="${bc}" class="pg-core"/>`;
    }
    const add = bo.some((o) => ['addGen', 'addFlatLoad', 'addBatt'].includes(o.op));
    badge(bd.x + 13, bd.y - 13, add ? '+' : '~', add ? 'Added at this substation in this branch' : 'Modified at this substation in this branch', bc);
  });
  // buses
  E.BUSES.forEach((bd) => {
    const b = m.buses[bd.id];
    const tags = [];
    b.gens.forEach((g) => { if (g.mw > 0) tags.push([g.type.toUpperCase() + ' ' + g.mw, { hydro: 'var(--blue)', gas: 'var(--ink-2)', solar: 'var(--c-sun)', wind: 'var(--c-wind)' }[g.type]]); });
    if (b.batt) tags.push(['BATT ' + b.batt, 'var(--ok)']);
    if (b.load) tags.push(['LOAD ' + b.load, 'var(--ink)']);
    if (b.flat) tags.push(['DATA CTR ' + b.flat, 'var(--c-metro)']);
    Object.entries(b.cap).forEach(([t, v]) => tags.push(['CAP ' + v, 'var(--bad)']));
    const [dx, dy, anchor, dir] = bd.lab;
    const ax = bd.x + dx, nameY = bd.y + dy;
    s += `<g class="bus" data-bus="${bd.id}" tabindex="0" role="button" aria-label="${bd.name}">`;
    s += `<circle cx="${bd.x}" cy="${bd.y}" r="18" fill="transparent"/>`;
    s += `<rect x="${bd.x - 10}" y="${bd.y - 10}" width="20" height="20" rx="4" fill="var(--paper)" stroke="var(--ink)" stroke-width="2.4"/>`;
    s += `<text x="${bd.x}" y="${bd.y + 3.5}" text-anchor="middle" font-size="9" font-weight="700" fill="var(--ink)">${bd.id}</text>`;
    s += `<text x="${ax}" y="${nameY}" text-anchor="${anchor}" font-size="11.5" font-weight="700" fill="var(--ink)" stroke="var(--paper)" stroke-width="3" paint-order="stroke" style="font-family:var(--f-body)">${bd.name}</text>`;
    tags.forEach(([txt, c], i) => {
      const ty = dir > 0 ? nameY + 4 + i * 13 : nameY - 23 - i * 13;
      const tw = txt.length * 5.6 + 8;
      const tx = anchor === 'start' ? ax : anchor === 'end' ? ax - tw : ax - tw / 2;
      s += `<rect x="${tx}" y="${ty}" width="${tw}" height="11.5" rx="2" fill="${c}"/><text x="${tx + 4}" y="${ty + 8.6}" font-size="8.3" fill="var(--paper)" font-weight="600">${txt}</text>`;
    });
    s += `</g>`;
  });
  return `<div class="mapwrap">` + s + badges.join('') + `</svg></div>`;
}

function clusterBox(st) {
  const open = G.L.companies.filter((c) => !G.br[c].merged);
  const v = st.violations;
  return `<div class="box cluster"><h4><span>Cluster preview</span><span>${open.length} open branch${open.length === 1 ? '' : 'es'}</span></h4>
    <p class="small">The map shows main plus every open branch (${open.map((c) => esc(CO[c].short)).join(', ') || 'none'}) as if they all merged together. It's a what-if, like a cluster study. Merging is still one branch at a time, and each branch's own checks are below.</p>
    <ul class="checks"><li class="${v.length ? 'fail' : 'pass'}"><span class="ic">${v.length ? '✕' : '✓'}</span><span>${v.length ? `Together: ${v.length} violation${v.length > 1 ? 's' : ''}` : 'Together, every study passes'}${v.length ? `<ul class="viol">${v.slice(0, 4).map((x) => `<li>${esc(E.vText(x))}</li>`).join('')}${v.length > 4 ? `<li>+${v.length - 4} more</li>` : ''}</ul>` : ''}</span></li></ul></div>`;
}
function mainPanel(st) {

  return `
    <div class="box"><h4><span>Main · approved model</span><span>v${G.main.ver}</span></h4>

      <ul class="checks"><li class="${bad.length ? 'fail' : 'pass'}"><span class="ic">${bad.length ? '✕' : '✓'}</span><span>${bad.length ? bad.length + ' reliability violation' + (bad.length > 1 ? 's' : '') + ' on main' : 'Main passes every study'}${bad.length ? `<ul class="viol">${bad.slice(0, 6).map((v) => `<li>${esc(E.vText(v))}</li>`).join('')}</ul>` : ''}</span></li></ul>
    </div>
    <div class="box"><h4><span>Commit history</span></h4><ul class="log">${log}</ul></div>

function ledgerBox() {
  if (!G.ledger.length) return '';
  return `<div class="box"><h4><span>Cost-sharing agreements</span><span>${G.ledger.length}</span></h4><ul class="log">${G.ledger.map((l) => `<li><span class="v">$${fmt(share(l))}M</span><span>${esc(CO[l.from].short)} → ${esc(CO[l.to].short)}: ${esc(l.label)}</span></li>`).join('')}</ul></div>`;
}
const OPINFO = {
  addGen: { name: 'New generator (the company\u2019s project)', good: 'Adding clean supply. It cuts gas use and covers peak shortfalls if the grid can carry it to load.', bad: 'Anything on its own. New power has to flow somewhere, and it usually overloads the nearest lines first.', real: 'Each one starts as an interconnection request that waits in the queue for studies.' },
  addFlatLoad: { name: 'New data-center load (the company\u2019s project)', good: 'Nothing. It\u2019s the demand you\u2019re here to serve, flat 24/7, so it stresses both scenarios.', bad: 'Ignoring supply. If nobody adds generation or storage, peak runs short.', real: 'Large loads now go through studies much like generators do.' },
  retire: { name: 'Plant retirement', good: 'Cutting emissions and old costs.', bad: 'Peak supply and the lines that used to carry that plant\u2019s power the other way.', real: 'Grid operators can delay a retirement if the studies show reliability problems.' },
  upgrade: { name: 'Rebuild (reconductor)', good: 'One line that\u2019s simply too small, overloaded with all lines in or during an outage, when the path itself is right.', bad: 'Problems where there\u2019s only one path. A bigger line is still lost if it trips. It\u2019s also slow and costly on long lines.', real: 'Takes years of permitting and outages to do. Cost scales with length.' },
  dlr: { name: 'Dynamic line rating', good: 'Lines that overload only in cool or windy weather. Wind cools the wire, so a windy night gains about 15% capacity. It\u2019s cheap and fast.', bad: 'Hot, still summer peaks (only about +5%) and big gaps. It squeezes more out of a line; it doesn\u2019t double it.', real: 'A grid-enhancing technology. AES uses it, and FERC has pushed for wider adoption.' },
  addLine: { name: 'New corridor', good: 'Outage (N-1) problems, because it adds a second path. Also moving lots of new power to load, and serving two companies at once.', bad: 'Tight budgets and quick fixes. It also reshuffles flows everywhere, so check other lines afterward.', real: 'The slowest option in reality (siting, permits, landowners). Cost allocation is where the fights happen.' },
  addBatt: { name: 'Battery', good: 'Peak supply shortfalls, and shaving peak flow into a congested load pocket.', bad: 'Night problems (it charges then, which adds load) and overloads at the generator end of a line.', real: 'Fast to build. Planners need assumptions about when it charges and discharges in each scenario.' },
  cap: { name: 'Export cap', good: 'Getting a project connected cheaply and quickly when the grid can only take part of its output.', bad: 'Clean-energy goals. The capped energy is thrown away, and it can\u2019t fix problems unrelated to that plant.', real: 'Like a provisional or limited interconnection, or a runback scheme, that a developer accepts while upgrades wait.' },
};
function branchPanel(cid) {
  const b = G.br[cid], C = CO[cid];

    return `<div class="box brief glow" style="--tc:${C.color};--gc:${C.color};--gc2:${C.color};--gbg:var(--paper)"><h4><span>${esc(C.name)} · ${esc(C.role)}</span><span class="good">Merged</span></h4>
      <p>${esc(C.goal)}. Merged to main at ${Math.floor(b.mergedAt / 60)}:${String(b.mergedAt % 60).padStart(2, '0')}${b.late ? ' (late)' : ''}${b.forced ? ', with violations accepted' : ''}.</p>

  }
  const ck = checksFor(cid);
  const conf = behind(cid) ? conflictsFor(cid) : [];
  const physFail = ck.list.filter((c) => !c.ok && ['flow', 'n1', 'budget'].includes(c.k));
  const gateFail = ck.list.filter((c) => !c.ok && ['data', 'sync'].includes(c.k));
  const allOk = ck.list.every((c) => c.ok);

    const cls = o.op === 'retire' ? 'del' : ['upgrade', 'dlr', 'cap', 'rerate'].includes(o.op) ? 'mod' : 'add';
    const cost = E.opCost(o);
    const tip = OPINFO[o.op];
    return `<li class="${cls}"><span class="tx">${esc(E.opText(o))}</span>${tip ? `<span class="infowrap"><button class="info" aria-label="What this is good for" aria-describedby="tip-${o.id}">i</button><span class="tip" role="tooltip" id="tip-${o.id}"><b>${esc(tip.name)}</b><span class="tg">Good for</span>${esc(tip.good)}<span class="tg">Not good for</span>${esc(tip.bad)}<span class="tg">In real life</span>${esc(tip.real)}</span></span>` : ''}${cost ? `<span class="c">$${cost}M</span>` : ''}${o.locked ? '<span class="c" title="The company\'s own project">project</span>' : `<button class="x" data-rm="${o.id}" aria-label="Remove change">×</button>`}</li>`;
  }).join('');
  const issue = b.issue;
  const issueHTML = issue.state === 'open' ? `<div class="issue"><b>Validation failed on import</b><span>${esc(issue.text)}</span>
      <div class="btnrow"><button class="btn ghost" id="reqfix">Request corrected file (~${issue.wait}s)</button><button class="btn warnb" id="patch">Patch with a typical value</button></div></div>`
    : issue.state === 'waiting' ? `<div class="issue"><b>Waiting on ${esc(C.short)}</b><span>Corrected file due in <span class="mono" id="issueCd" data-until="${issue.until}">${Math.max(0, issue.until - G.t)}s</span>. Keep working on upgrades in the meantime.</span></div>` : '';
  return `
    <div class="box brief glow" style="--tc:${C.color};--gc:${C.color};--gc2:${C.color};--gbg:var(--paper)">
      <h4><span>${esc(C.name)} · ${esc(C.role)}</span>${deadline ? `<span class="${b.late ? 'badc' : ''}">due ${Math.floor(deadline / 60)}:${String(deadline % 60).padStart(2, '0')} left</span>` : ''}</h4>
      <p><b>${esc(C.goal)}.</b></p>
      <div class="budget"><div class="bar ${sp > C.budget ? 'over' : ''}"><i style="width:${Math.min(100, 100 * sp / C.budget)}%"></i></div><span class="small mono">$${fmt(sp)}M of $${C.budget}M budget</span></div>
      ${issueHTML}
    </div>

function cofundBox(cid) {

function findOp(id) {

}

// ---- sync / conflicts ----
function doSync(cid) {

  resolveConflict(cid, conf, 0);
}
function resolveConflict(cid, conf, i) {
  if (i >= conf.length) { G.br[cid].baseVer = G.main.ver; closeSheet(); toast('Conflicts resolved and synced'); renderGame(); return; }
  const { mine, theirs } = conf[i];
  const owner = theirs.owner && CO[theirs.owner] ? CO[theirs.owner].short : 'Grid operator';
  const canShare = theirs.owner && CO[theirs.owner] && E.opCost(theirs) > 0;
  openSheet(`<span class="eyebrow">Merge conflict ${i + 1} of ${conf.length}</span>
    <h3>${esc(E.lineLabel(mine.line))}</h3>
    <p class="small">Both branches changed the same line, so the model can't hold both versions.</p>
    <dl class="kv"><dt>Main (${esc(owner)})</dt><dd>${esc(E.opText(theirs))}</dd><dt>Yours (${esc(CO[cid].short)})</dt><dd>${esc(E.opText(mine))}</dd></dl>
    ${canShare ? `<button class="opt" data-r="share"><b><span>Make it a joint project</span><span class="mono">pay $${fmt(E.opCost(theirs) / (G.ledger.filter((x) => x.opId === theirs.id).length + 2))}M</span></b><span class="small muted">Drop your duplicate and co-fund ${esc(owner)}'s version. This is usually the right call.</span></button>` : ''}
    <button class="opt" data-r="theirs"><b><span>Use main's version</span><span class="mono">$0</span></b><span class="small muted">Drop your change. Your studies re-run on theirs.</span></button>
    <button class="opt" data-r="mine"><b><span>Keep mine on top</span><span class="mono">$${E.opCost(mine)}M</span></b><span class="small muted">Your edit overrides theirs once merged. You pay for both, and it could break their project.</span></button>`);
  $('#sheet').querySelectorAll('[data-r]').forEach((bt) => (bt.onclick = () => {
    const b = G.br[cid]; const r = bt.dataset.r; G.tried.conflicts.push({ cid, r, line: mine.line }); if (r === 'share') G.tried.ops.add('cofund');
    if (r === 'share') { b.ops = b.ops.filter((o) => o.id !== mine.id); G.ledger.push({ from: cid, to: theirs.owner, amt: E.opCost(theirs) / 2, opId: theirs.id, label: E.opText(theirs).replace(/^[+~−-]\s*/, '') }); }
    if (r === 'theirs') b.ops = b.ops.filter((o) => o.id !== mine.id);
    resolveConflict(cid, conf, i + 1);
  }));
}
function confirmForce(cid) {

    <ul class="viol">${fails.map((c) => `<li>${esc(c.label)}</li>`).join('')}</ul>
    <div class="btnrow"><button class="btn ghost grow" id="cx">Keep working</button><button class="btn danger grow" id="ok">Merge anyway</button></div>`);

}
function doMerge(cid, forced) {
  const b = G.br[cid];

  commit(cid, b.ops.map((o) => ({ ...o })), `Merge ${CO[cid].short}: ${CO[cid].goal.toLowerCase()}`);
  b.merged = true; b.mergedAt = G.t; b.forced = forced; if (forced) G.forced++;
  const after = studyFor(mainOps());

  const curt = SK.reduce((t, k) => t + after.metrics[k].curtail, 0);
  const others = G.L.companies.filter((x) => !G.br[x].merged);
  const done = !others.length && !G.L.playground;
  openSheet(`<span class="eyebrow">Merged to main · v${G.main.ver}</span><h3>${esc(CO[cid].name)}</h3>
    <div class="outcome">

      <div><span class="small muted">CO₂ at peak</span><b class="${d('co2') <= 0 ? 'good' : 'badc'}">${d('co2') > 0 ? '+' : ''}${Math.round(d('co2'))} t/h</b></div>
      <div><span class="small muted">Curtailed (peak + night)</span><b class="${curt > 0.5 ? 'warnc' : 'good'}">${Math.round(curt)} MW</b></div>
      <div><span class="small muted">Violations on main</span><b class="${after.violations.length ? 'badc' : 'good'}">${after.violations.length}</b></div>
    </div>
    <p class="small">${forced ? 'You merged with failing checks. The violations are now in the shared model, and every open branch inherits them.' : curt > 0.5 ? 'It’s reliable, but some clean energy is being thrown away. A bigger path to load would deliver all of it.' : 'Every study passed, and no clean energy is wasted.'}${others.length ? ` Main moved, so ${others.map((x) => CO[x].short).join(' and ')} must sync before merging.` : ''}</p>
    <div class="btnrow"><button class="btn grow" id="cont">${done ? 'See results' : 'Continue'}</button></div>`);
  $('#cont').onclick = () => { closeSheet(); if (done) finish('done'); else { if (others.length) G.sel = others[0]; renderGame(); } };
  renderGame();
}

// ---- element sheets ----
function lineSheet(lid) {
  const sel = G.sel;
  const ops = shownOps(sel); const m = E.build(ops); const st = studyFor(ops);
  const l = m.lines[lid]; const corr = E.CORRIDORS.find((c) => c.id === lid);
  const editable = sel !== 'main' && !G.br[sel].merged;
  const mine = editable ? G.br[sel].ops.filter((o) => o.line === lid) : [];

  if (l) {
    const SKs = Object.keys(st.loading); const lp = st.loading[SKs[0]][lid], ln = st.loading[SKs[1] || SKs[0]][lid], wp = st.worst[SKs[0]][lid], wn = st.worst[SKs[1] || SKs[0]][lid];
    html += `<dl class="kv"><dt>Rating</dt><dd>${l.rating} MW normal · ${Math.round(l.rating * E.LTE)} MW emergency${l.dlr ? ' · DLR on' : ''}</dd>
      ${SKs.length > 1 ? `<dt>Peak flow</dt><dd>${Math.round(Math.abs(lp.mw))} MW (${Math.round(lp.pct * 100)}%)</dd>
      <dt>Night flow</dt><dd>${Math.round(Math.abs(ln.mw))} MW (${Math.round(ln.pct * 100)}%)</dd>` : `<dt>Flow (sun ${G.sun}, wind ${G.wind})</dt><dd>${Math.round(Math.abs(lp.mw))} MW (${Math.round(lp.pct * 100)}%)</dd>`}
      <dt>Worst outage</dt><dd>${Math.round(Math.max(wp.pct, wn.pct) / E.LTE * 100)}% of emergency${(wp.pct >= wn.pct ? wp.by : wn.by) ? ' if ' + esc(E.lineLabel(wp.pct >= wn.pct ? wp.by : wn.by)) + ' trips' : ''}</dd></dl>`;
  } else html += `<p class="small">An unbuilt right-of-way, ${corr.km} km. A new ${corr.rating} MW line here adds a parallel path and changes flows across the whole grid.</p>`;
  if (!editable) html += `<p class="small muted">${sel === 'main' ? 'Main is read-only. Switch to a company branch to propose changes.' : 'This branch is already merged.'}</p>`;
  else {
    const has = (op) => mine.find((o) => o.op === op);
    const inView = (op) => ops.some((o) => o.line === lid && o.op === op);
    if (!l) html += optBtn('build', `Build new ${corr.rating} MW line`, corr.cost, 'Big, slow and expensive, but it adds a parallel path that also survives outages.');
    else {
      if (!l.upgraded && !has('upgrade')) html += optBtn('upgrade', `Rebuild: ${l.rating} → ${l.rating + 150} MW`, E.opCost({ op: 'upgrade', line: lid }), 'Reconductor with a higher-capacity wire. Same path, more capacity.');

  }
  html += `<button class="btn ghost" id="close">Close</button>`;
  openSheet(html);
  const b = G.br[sel];
  $('#sheet').querySelectorAll('[data-opt]').forEach((bt) => (bt.onclick = () => {
    const k = bt.dataset.opt;
    if (k === 'build') b.ops.push(G.mk({ op: 'addLine', line: lid }, sel));

  $('#close').onclick = closeSheet;
}

function finish(why) {

    if (b.merged) { add(`${C.short} merged`, 100); if (!b.late) add(`${C.short} on time`, 40); }

    const sp = spend(cid);
    if (b.merged) add(`${C.short} budget ($${fmt(sp)}M of $${C.budget}M)`, sp <= C.budget ? (C.budget - sp) / 2 : -(sp - C.budget) * 2);
  });
  const vio = st.violations.length;
  add(vio ? `Main has ${vio} violation${vio > 1 ? 's' : ''}` : 'Main passes every study', vio ? -40 * Math.min(vio, 6) : 150);

  const stars = total >= L.stars[2] ? 3 : total >= L.stars[1] ? 2 : total >= L.stars[0] ? 1 : 0;
  if (stars > (best['lab-' + L.id] || 0)) { best['lab-' + L.id] = stars; saveBest(); }
  const rv = review(st, curt, vio);

  openSheet(`<span class="eyebrow">Level ${L.id} complete${why === 'time' ? ' · filing window closed' : ''}</span>

    </div>

    <div class="btnrow"><button class="btn ghost grow" id="retry">Replay</button>${L.id < LEVELS.length ? `<button class="btn grow" id="nextL">${L.id + 1 === LEVELS.length ? 'Playground' : 'Level ' + (L.id + 1)}</button>` : `<button class="btn grow" id="toLab">All levels</button>`}</div>`);
  $('#retry').onclick = () => { closeSheet(); route(); };
  const nx = $('#nextL'); if (nx) nx.onclick = () => { closeSheet(); go('play-' + (L.id + 1)); };
  const tl = $('#toLab'); if (tl) tl.onclick = () => { closeSheet(); go('lab'); };
}

const mmss = (t) => Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
function review(st, curt, vio) {
  const L = G.L, T = G.tried;
  const merged = G.main.commits.flatMap((c) => c.ops);
  // ---- your plan ----
  const plan = L.companies.map((cid) => {
    const C = CO[cid], b = G.br[cid];
    const ops = (b.merged ? merged : b.ops).filter((o) => o.owner === cid && !o.locked);
    const items = ops.map((o) => `${E.opText(o)}${E.opCost(o) ? ` ($${E.opCost(o)}M)` : ''}`);
    G.ledger.filter((l) => l.from === cid).forEach((l) => items.push(`co-funded a share of ${CO[l.to].short}’s ${l.label} ($${fmt(share(l))}M)`));
    G.ledger.filter((l) => l.to === cid).forEach((l) => items.push(`${CO[l.from].short} paid a share of your ${l.label}`));
    const iss = b.issue.state === 'patched' ? 'patched the data error with a typical value' : T.requests[cid] != null ? `requested a corrected file at ${mmss(T.requests[cid])}` : 'left the data error unresolved';
    if (!b.issue.none) items.push(iss);
    T.conflicts.filter((c) => c.cid === cid).forEach((c) => items.push(`conflict on ${E.lineLabel(c.line)}: ${{ share: 'made it a joint project', theirs: 'took main’s version', mine: 'kept your version on top' }[c.r]}`));
    const status = b.merged ? `merged at ${mmss(b.mergedAt)}${b.late ? ' (late)' : ''}${b.forced ? ' with failing checks' : ''}` : 'not merged';
    return `<div class="rv-co" style="--tc:${C.color}"><b>${esc(C.short)}</b> <span class="muted small">${esc(status)} · spent $${fmt(spend(cid))}M of $${C.budget}M</span>
      <ul>${(ops.length ? [] : ['<li class="muted">no upgrades of its own</li>']).join('')}${items.map((i) => `<li>${esc(i)}</li>`).join('')}</ul></div>`;
  }).join('');
  // ---- untried ----
  const TOOLS = [['upgrade', 'Rebuilding a line'], ['dlr', 'Dynamic line rating'], ['addLine', 'Building a new corridor'], ['addBatt', 'Batteries'], ['cap', 'Export caps']];
  const untried = TOOLS.filter(([k]) => !T.ops.has(k)).map(([, n]) => n);
  if (L.companies.length > 1 && !T.ops.has('cofund')) untried.push('Co-funding');
  if (!T.views.has('n1')) untried.push('Worst outage view');
  if (!T.views.has('night') && !L.playground) untried.push('Windy night view');
  if (!T.ops.has('request') && L.companies.some((c) => !G.br[c].issue.none)) untried.push('Requesting corrected data');
  // ---- notes (questions, not answers) ----
  const notes = [];
  const unmerged = L.companies.filter((c) => !G.br[c].merged);
  unmerged.forEach((cid) => { const f = checksFor(cid).list.find((c) => !c.ok); if (f) notes.push(`${CO[cid].short} never merged. Its first failing check was “${f.label}.” What would have needed to happen earlier to clear it?`); });
  if (G.forced) notes.push(`You merged ${G.forced} branch${G.forced > 1 ? 'es' : ''} with failing checks. Open the Worst outage view on the reddest line: is the problem that line’s capacity, or the lack of a second path?`);
  else if (vio) notes.push(`Main ended with ${vio} violation${vio > 1 ? 's' : ''}. On main, switch to Worst outage and find which outage stresses which line. What changed on main after your last merge?`);
  if (curt > 0.5) notes.push(`Your plan threw away ${Math.round(curt)} MW of clean energy to save money. Remove the cap in a replay and open the Worst outage view: which line is the real bottleneck, and does fixing it cost more or less than the energy you\u2019re wasting?`);
  L.companies.forEach((cid) => { const C = CO[cid], sp = spend(cid); if (G.br[cid].merged && sp > C.budget + 0.01) notes.push(L.companies.length > 1 ? `${C.short} spent $${fmt(sp)}M against a $${C.budget}M budget. Does anyone else’s power ride on what ${C.short} paid for?` : `${C.short} went $${fmt(sp - C.budget)}M over budget. Is there a fix that keeps every check green for less, and what would it cost in clean energy? Compare both runs’ scores.`); });
  if (L.companies.length > 1 && !G.ledger.length) notes.push('Each company paid for its own upgrades. In one branch, look at where its new power actually flows on the map. Does any upgrade carry power for someone else?');
  if (merged.some((o) => o.owner === 'metro' && o.op === 'addBatt')) notes.push('Metro bought batteries to cover a supply gap. Was that gap still there once the other branches merged? Merge order changes what each branch needs.');
  const windSp = L.companies.includes('wind') ? spend('wind') : 0;
  if (windSp > 20) notes.push(`Northwind spent $${fmt(windSp)}M. Its trouble shows up in one weather condition. Is there a tool that’s strongest in exactly that weather?`);
  if (T.conflicts.some((c) => c.r === 'mine')) notes.push('In a conflict you kept your version on top, so two companies paid for one corridor. What would a joint project have changed for both budgets?');
  if (G.patched) notes.push('Patching skips a wait but leaves unverified data in the audit trail. When could you have asked for the corrected file so the wait cost you nothing?');
  else if (L.timer && Object.values(T.requests).some((t) => t > 30)) notes.push(`Some corrected-file requests went out late (${Object.values(T.requests).map(mmss).join(', ')}). What else could you have done while waiting on them?`);
  if (!T.views.has('n1') && notes.length < 4) notes.push('You never opened the Worst outage view. It shows which outage overloads which line, which is usually the fastest way to choose a fix.');
  if (!notes.length) notes.push(L.companies.length === 1 ? 'Clean run. Challenge: can any plan deliver every MW of solar and stay on budget? If not, what would you go back and negotiate?' : 'Clean, collaborative and on budget, with nothing left to flag.');
  return { plan, untried, notes: notes.slice(0, 3) };
}
function skill(stars, curt, vio) {
  const L = G.L, T = G.tried;
  const finalOps = G.main.commits.flatMap((c) => c.ops).filter((o) => o.owner && o.owner !== 'iso' && !o.locked).length;
  const churn = (T.added || 0) - finalOps;
  const allMerged = L.companies.every((c) => G.br[c].merged);
  const overs = L.companies.filter((c) => spend(c) > CO[c].budget + 0.01).length;
  const reqTimes = Object.values(T.requests);
  const withIssue = L.companies.filter((c) => !G.br[c].issue.none).length;
  const earlyReq = withIssue === 0 || (reqTimes.length === withIssue && reqTimes.every((t) => t <= 20));
  let nov = 0, exp = 0; const sig = [];
  if (G.forced) { nov += 2; sig.push('merged past failing checks'); }
  if (G.patched) { nov += 1; sig.push('patched data'); }
  if (!allMerged) { nov += 2; sig.push('left a branch unmerged'); }
  if (vio) { nov += 1; }
  if (!T.views.has('n1')) { nov += 1; sig.push('never checked worst outages'); }
  if (churn >= 4) { nov += 1; sig.push('lots of trial and error'); }
  if (stars === 3) { exp += 2; sig.push('three stars'); }
  if (earlyReq) { exp += 1; sig.push('requested data up front'); }
  if (T.views.has('n1') && T.views.has('night')) exp += 1;
  if (L.companies.length > 1 && G.ledger.length) { exp += 1; sig.push('shared costs'); }
  if (curt < 0.5 && !overs && allMerged && !vio) exp += 1;
  if (churn <= 1 && allMerged) { exp += 1; sig.push('few wasted moves'); }
  const level = nov >= 3 || stars <= 1 ? 'Novice' : exp >= 5 && nov === 0 ? 'Expert' : 'Moderate';
  const why = 'Based on: ' + (sig.length ? sig.slice(0, 4).join(', ') : 'a mixed run') + '.';
  const tries = [];
  const windSp = L.companies.includes('wind') ? spend('wind') : 0;
  if (level === 'Novice') {
    if (!T.ops.has('request') || G.patched) tries.push('the moment the level starts, tap “Request corrected file” in every branch. The wait runs while you work.');
    if (!T.views.has('n1')) tries.push('before adding anything, switch to “Worst outage”, tap the reddest line and read which outage causes it. Fix that one line, then look again.');
    if (G.forced || vio) tries.push('only press Merge when all five checks are green. If you’re stuck, use the Hint button on that branch.');
    if (!allMerged) tries.push('merge the branch with the fewest failing checks first, then sync the others and see what changed.');
    if (curt > 0.5) tries.push('skip the export cap and see what it really takes to deliver all the solar, even if you go a little over budget.');
    tries.push('change one thing at a time and watch the line percentages move. That’s how planners build intuition for power flow.');
  } else if (level === 'Moderate') {
    if (curt > 0.5) tries.push('deliver every MW of clean energy with no export cap, while staying within 10% of budget.');
    if (L.companies.length > 1 && !G.ledger.length) tries.push('find one upgrade that solves problems for two companies, and split its cost.');
    if (L.companies.length > 1) tries.push('decide the merge order before you build anything. Which branch should land first so the others need less?');
    if (windSp > 10) tries.push(`get Northwind merged for under $10M (you spent $${fmt(windSp)}M). Think about when its problem happens.`);
    if (!T.views.has('night')) tries.push('check the windy night before every merge. Some lines only fail there.');
    if (G.patched || !earlyReq) tries.push('request every corrected file in the first 20 seconds and never patch.');
    if (overs) tries.push('bring every company in on budget without merging past a failing check.');
    tries.push('beat your score by finishing faster. In timed levels, the time left is worth points.');
  } else {
    const tot = L.companies.reduce((s, c) => s + spend(c), 0);
    tries.push(`earn three stars again while spending less than this run\u2019s $${fmt(tot)}M across all companies.`);
    if (L.companies.length > 1) tries.push('merge the companies in a different order and compare total spend. Is your plan order-independent?');
    if (T.ops.has('addLine')) tries.push('solve it without building any new corridor. Is that even possible, and what does it cost in clean energy?');
    if ((L.events || []).length) tries.push('leave enough headroom that the mid-cycle change to main lands without breaking a single merged branch.');
    tries.push('write down the plan you’d pitch to the three companies before you touch the map, then see whether the sim agrees.');
  }
  return { level, why, tries: tries.slice(0, 3) };
}

function showHint() {
  const cid = G.sel;
  let msg;
  if (cid === 'main') msg = 'Main is read-only. Pick a company tab: its Checks list shows what’s blocking the merge.';
  else if (G.br[cid].merged) msg = `${CO[cid].short} is merged. Look at the other tabs: anything marked “behind” needs a sync.`;
  else {
    const ck = checksFor(cid); const f = ck.list.find((c) => !c.ok);
    if (!f) msg = 'Every check passes. Before merging, ask whether you’re paying for something another company would share, and whether any clean energy is being curtailed.';
    else if (f.k === 'data') msg = f.wait ? 'The corrected file is on its way. Design upgrades while you wait.' : 'The model import failed validation. You can wait for a corrected file or patch it now. One costs time; the other costs trust in the data.';
    else if (f.k === 'sync') msg = 'Main moved since this branch was tested. Sync first: your results may change, for better or worse.';
    else if (f.k === 'budget') msg = 'Over budget. Which of your upgrades also helps another company? And is there a cheaper tool that fixes the same violation?';
    else {
      const v = f.v[0];
      if (v.kind === 'adequacy') msg = `There isn’t enough supply at ${E.scen(v.scen).short}. Does this branch have to add it, or is supply arriving from another branch? Switch the map to \u201cAll open branches\u201d to preview them together.`;
      else if (v.kind === 'island') msg = `One outage cuts off customers entirely. What gives that substation a second way in?`;
      else msg = `Start with ${E.lineLabel(v.line)} (${Math.round(v.pct * 100)}%${v.cont ? ` when ${E.lineLabel(v.cont)} trips` : ''}, ${E.scen(v.scen).short === 'peak' ? 'summer peak' : 'windy night'}). Is the issue that one line\u2019s capacity, or that power has no other path?${v.scen === 'night' ? ' And what does a windy night do for a line\u2019s capacity?' : ''}`;
    }
  }
  openSheet(`<span class="eyebrow">Hint · ${cid === 'main' ? 'main' : esc(CO[cid].short)}</span><p>${esc(msg)}</p><button class="btn" id="hok">Back to work</button>`);
  $('#hok').onclick = closeSheet;
}

window.__gridlab = { get G() { return G; } };
route();
})();
