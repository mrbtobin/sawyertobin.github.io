<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Chibi Life</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(ellipse at center,#2d1b4e 0%,#1a0a2e 100%);display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'Segoe UI',sans-serif;overflow:hidden}
#wrap{position:relative;width:800px;height:560px}
canvas{display:block;border-radius:16px;cursor:pointer;width:100%;height:auto;touch-action:none}
#wrap{width:min(800px,100vw);height:auto;aspect-ratio:800/560}
body{padding:0;margin:0}
.panel{position:absolute;background:rgba(255,255,255,0.97);border:2px solid #FFB3D9;border-radius:16px;padding:16px;z-index:20;box-shadow:0 8px 32px rgba(0,0,0,0.18)}

.btn{background:linear-gradient(135deg,#FFB3D9,#C080FF);border:none;border-radius:20px;padding:7px 16px;color:#fff;font-weight:700;cursor:pointer;font-size:13px;transition:transform .1s}
.btn:hover{transform:scale(1.06)}
.btn.sm{padding:4px 10px;font-size:11px}

<body>
<div id="wrap">
<canvas id="c" width="800" height="560"></canvas>
<div id="notif" class="notif" style="opacity:0"></div>

<script>
// ─── CANVAS SETUP ───────────────────────────────────────────────────────────
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const W=800,H=560;
let frame=0,scene='town';

// ─── ROUNDED RECT (ctx as first arg) ────────────────────────────────────────
function rr(c,x,y,w,h,r,fill){
  if(typeof r==='number')r=[r,r,r,r];
  c.fillStyle=fill;c.beginPath();
  c.moveTo(x+r[0],y);c.lineTo(x+w-r[1],y);c.arcTo(x+w,y,x+w,y+r[1],r[1]);
  c.lineTo(x+w,y+h-r[2]);c.arcTo(x+w,y+h,x+w-r[2],y+h,r[2]);
  c.lineTo(x+r[3],y+h);c.arcTo(x,y+h,x,y+h-r[3],r[3]);
  c.lineTo(x,y+r[0]);c.arcTo(x,y,x+r[0],y,r[0]);
  c.closePath();c.fill();
}

// ─── NOTIFICATION ────────────────────────────────────────────────────────────
let notifTimer=0;
function notify(msg){
  const el=document.getElementById('notif');
  el.textContent=msg;el.style.opacity='1';
  clearTimeout(notifTimer);
  notifTimer=setTimeout(()=>el.style.opacity='0',2000);
}

// ─── WEB AUDIO ───────────────────────────────────────────────────────────────
let AC=null,muted=false,musicInterval=null;
function getAC(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();return AC;}
function playTone(freq,type='sine',dur=0.15,vol=0.18,freq2=null){
  try{
    const ac=getAC();if(ac.state==='suspended')ac.resume();
    const o=ac.createOscillator(),g=ac.createGain();
    o.connect(g);g.connect(ac.destination);
    o.type=type;o.frequency.value=freq;
    if(freq2)o.frequency.linearRampToValueAtTime(freq2,ac.currentTime+dur);
    g.gain.value=vol;g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+dur);
    o.start();o.stop(ac.currentTime+dur);
  }catch(e){}
}
function petSound(type){
  if(muted)return;
  if(type==='cat'){playTone(500,'sine',0.1,0.15,900);setTimeout(()=>playTone(900,'sine',0.15,0.15,500),100);}
  else if(type==='dog'){playTone(220,'sawtooth',0.12,0.2,160);}
  else if(type==='bunny'){playTone(1400,'sine',0.08,0.12,1800);}
  else if(type==='bird'){[1600,2000,1800].forEach((f,i)=>setTimeout(()=>playTone(f,'triangle',0.07,0.12),i*60));}
  else if(type==='hamster'){playTone(2200,'sine',0.06,0.1);}
  else if(type==='duck'){playTone(400,'sawtooth',0.1,0.18,300);}
  else if(type==='turtle'){playTone(280,'sine',0.4,0.14,240);}
}

// ─── MUSIC SEQUENCER ─────────────────────────────────────────────────────────
const NOTES={C3:130.8,D3:146.8,E3:164.8,F3:174.6,G3:196,A3:220,B3:246.9,
  C4:261.6,D4:293.7,E4:329.6,F4:349.2,G4:392,A4:440,B4:493.9,
  C5:523.3,D5:587.3,E5:659.3,F5:698.5,G5:784,A5:880,B5:987.8,
  C6:1046.5,D6:1174.7,E6:1318.5,F6:1396.9,G6:1568,A6:1760,B6:1975.5,
  Bb4:466.2,Eb4:311.1,Ab4:415.3,Db4:277.2,Gb4:370,Bb3:233.1,Eb3:155.6,

function rep(arr,n){let r=[];for(let i=0;i<n;i++)r=r.concat(arr);return r;}

const MUSIC_THEMES={

    melody:['G4',null,null,null,'A4',null,null,null,'C5',null,null,null,'D5',null,null,null,'E5',null,null,null,'C5',null,null,null,'A4',null,null,null,'G4',null,null,null,'E5',null,null,null,'D5',null,null,null,'C5',null,null,null,'A4',null,null,null,'G4',null,null,null,'A4',null,null,null,'C5',null,null,null,'G4',null,null,null],

    harmony:rep(['C5','C5','E5','F5','E5','C5','A4','B4','C5','E5','F5','E5','F5','A5','G5','F5','A4','A4','C5','E5','C5','A4','G4','F4','A4','C5','E5','C5','B4','A4','G4',null,'G4','A4','B4','C5','D5','E5','F5','E5','D5','C5','B4','A4','G4','F4','E4',null,'E5','E5','D5','C5','B4','C5','D5','E5','F5','E5','D5','C5','B4','A4','G4',null],2),
    bass:rep(['C3',null,'C3',null,'E3',null,'G3',null,'C3',null,'C3',null,'A3',null,'G3',null,'F3',null,'F3',null,'A3',null,'C4',null,'F3',null,'G3',null,'G3',null,'G3',null,'C3',null,'C3',null,'C3',null,'C3',null,'F3',null,'F3',null,'G3',null,'G3',null,'C3',null,'C3',null,'F3',null,'G3',null,'C3',null,'E3',null,'G3',null,'C4',null],2)},
  sushi:{bpm:88,waveform:'triangle',stepDur:60/88/2,
    melody:rep(['D4',null,'F4',null,'G4','A4',null,'G4','D5',null,'A4',null,'G4','F4',null,'D4','F4',null,'G4','A4','C5',null,'A4',null,'G4','F4','D4',null,null,null,null,null],4),
    harmony:rep(['D3',null,null,null,'A3',null,null,null,'D4',null,null,null,'G3',null,null,null,'A3',null,null,null,'C4',null,null,null,'D3',null,null,null,null,null,null,null],4),
    bass:[]},
  apartments:{bpm:75,waveform:'sine',stepDur:60/75/2,
    melody:rep(['C5','E5','G5','B5','A5','G5','F5','E5','D5','F5','A5','C6','B5','A5','G5','F5','E5','G5','C6','E6','D6','C6','B5','A5','G5','F5','E5','D5','C5',null,null,null],4),
    harmony:rep(['E4','G4','C5',null,null,null,null,null,'F4','A4','C5',null,null,null,null,null,'G4','B4','D5',null,null,null,null,null,'C4','E4','G4',null,null,null,null,null],4),
    bass:rep(['C3',null,null,null,'G3',null,null,null,'F3',null,null,null,'C4',null,null,null,'G3',null,null,null,'D4',null,null,null,'C3',null,null,null,'G3',null,null,null],4)},
  petshop:{bpm:110,waveform:'triangle',stepDur:60/110/2,
    melody:rep(['G5','B5','D6','B5','G5','D5','E5','G5','A5','C6','E6','C6','A5','E5','G5','A5','G5','B5','D6','B5','G5','F5','E5','D5','C5','E5','G5','C6','B5','A5','G5',null],4),
    harmony:rep(['G4','B4','D5',null,'G4',null,'B4',null,'A4','C5','E5',null,'A4',null,'C5',null,'G4','B4','D5',null,'G4',null,'B4',null,'C4','E4','G4',null,'B4',null,'G4',null],4),
    bass:rep(['G3',null,'D4',null,'G3',null,'D4',null,'A3',null,'E4',null,'A3',null,'E4',null,'G3',null,'D4',null,'G3',null,'D4',null,'C3',null,'G3',null,'G3',null,'G3',null],4)},
  mall:{bpm:120,waveform:'triangle',stepDur:60/120/2,
    melody:rep(['C5','E5','G5','C6','B5','A5','G5','E5','F5','A5','C6','F6','E6','D6','C6','A5','G5','B5','D6','G6','F6','E6','D6','B5','C6','A5','G5','E5','D5','C5','B4',null],4),
    harmony:rep(['E4','G4','C5',null,null,null,null,null,'A4','C5','F5',null,null,null,null,null,'B4','D5','G5',null,null,null,null,null,'C5','E5','G5',null,null,null,null,null],4),
    bass:rep(['C3',null,'G3',null,'E3',null,'G3',null,'F3',null,'C4',null,'A3',null,'C4',null,'G3',null,'D4',null,'B3',null,'D4',null,'C3',null,'G3',null,'G3',null,'C4',null],4)},
  theater:{bpm:100,waveform:'triangle',stepDur:60/100/2,
    melody:rep(['C5','G4','A4','F4','C5','G4','A4','B4','C5','E5','G5','F5','E5','D5','C5',null,
                'F5','E5','D5','C5','B4','A4','G4','F4','E5','D5','C5','B4','A4','G4','E4',null],2),
    harmony:rep(['E4','C4','F4','D4','E4','C4','F4','G4','E4','G4','C5','A4','G4','F4','E4',null,
                 'A4','G4','F4','E4','D4','C4','B3','A3','G4','F4','E4','D4','C4','B3','C4',null],2),
    bass:rep(['C3',null,'F3',null,'C3',null,'G3',null,'C3',null,'G3',null,'F3',null,'G3',null,
              'F3',null,'C4',null,'G3',null,'C3',null,'F3',null,'G3',null,'C3',null,'G3',null],2)},
  haunted:{bpm:90,waveform:'sawtooth',stepDur:60/90/2,
    melody:rep(['A3',null,'C4',null,'Eb4',null,'A3',null,'G3',null,'Bb3',null,'Eb4',null,'D4',null,'F4',null,'Ab4',null,'C5',null,'Bb4',null,'A4',null,'G4',null,'F4',null,'Eb4',null],4),
    harmony:rep(['A2',null,null,null,'E3',null,null,null,'G2',null,null,null,'D3',null,null,null,'F2',null,null,null,'C3',null,null,null,'A2',null,null,null,'E3',null,null,null],4),
    bass:[]}
};
let seqStep=0,seqTimer=null,curTheme='town';
function stopMusic(){
  if(seqTimer){clearInterval(seqTimer);seqTimer=null;}
  // Let any in-flight notes finish naturally (they self-stop)
}
function startTheme(name){
  stopMusic();
  curTheme=name;seqStep=0;
  const t=MUSIC_THEMES[name]||MUSIC_THEMES.town;
  const ms=Math.round(t.stepDur*1000);
  const tracks=[t.melody,t.harmony,t.bass].filter(tr=>tr&&tr.length>0);
  seqTimer=setInterval(()=>{
    if(muted){seqStep++;return;}
    try{
      const ac=getAC();if(ac.state==='suspended')ac.resume();
      tracks.forEach((track,ti)=>{
        const note=track[seqStep%track.length];
        if(note&&NOTES[note]){
          const o=ac.createOscillator(),g=ac.createGain();
          o.connect(g);g.connect(ac.destination);
          o.type=t.waveform||'triangle';
          o.frequency.value=NOTES[note];
          const vol=ti===0?0.07:ti===1?0.05:0.06;
          g.gain.value=vol;
          g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+ms/1000*0.85);
          o.start();o.stop(ac.currentTime+ms/1000*0.85);
        }
      });
    }catch(e){}
    seqStep++;
  },ms);
}

// ─── MUSIC PARTICLES ─────────────────────────────────────────────────────────
const MNOTES=['♩','♪','♫','♬'];
let mParticles=[];
function spawnMParticle(){
  mParticles.push({x:Math.random()*W,y:H+10,note:MNOTES[Math.random()*4|0],alpha:1,speed:0.7+Math.random()*0.8,dx:(Math.random()-0.5)*0.5});
}
function updateMParticles(){
  mParticles=mParticles.filter(p=>p.alpha>0);
  mParticles.forEach(p=>{p.y-=p.speed;p.x+=p.dx;p.alpha-=0.005;});
}
function drawMParticles(){
  mParticles.forEach(p=>{
    ctx.globalAlpha=p.alpha;ctx.fillStyle='#FFB3D9';ctx.font='14px serif';
    ctx.fillText(p.note,p.x,p.y);
  });
  ctx.globalAlpha=1;
}

// ─── CHARACTER ────────────────────────────────────────────────────────────────
const char={
  x:400,y:380,tx:400,ty:380,
  skin:'#FFDBB0',hair:'#3A2010',hairStyle:'bob',eyeColor:'#3A6080',
  outfit:'dress',outfitColor:'#FFB3D9',outfitColor2:'#C080FF',
  earrings:false,earringColor:'#FFD700',
  facing:1,moving:false,step:0
};
const SKIN_TONES=['#FFDBB0','#F5C590','#E8A96A','#C8784A','#A05030','#7A3820'];
const HAIR_COLORS=['#3A2010','#1a1a1a','#C8A060','#E87040','#D040A0','#40A0D0','#8040D0','#60C060','#E0E0E0','#FF8080'];
const EYE_COLORS=['#3A6080','#40A040','#806030','#8040A0','#C06030','#4060C0','#C04060','#404040'];
const OUTFIT_COLORS=['#FFB3D9','#C080FF','#80C0FF','#80FFB3','#FFD080','#FF8080','#FF80FF','#80FFFF','#FFFFFF','#404080'];

function drawChar(x,y,c=char,s=1){
  ctx.save();ctx.translate(x,y);ctx.scale(c.facing,1);
  const wb=c.moving?Math.sin(c.step*0.3)*4*s:0;

  // SHADOW
  ctx.fillStyle='rgba(0,0,0,0.09)';
  ctx.beginPath();ctx.ellipse(0,34*s,17*s,5*s,0,0,Math.PI*2);ctx.fill();

  // BACK HAIR (behind head)
  drawHairBack(c,s);

  // LEGS
  const legCol=(c.outfit==='shirt+pants')?(c.outfitColor2||'#8090C0'):c.skin;
  rr(ctx,-10*s+wb*0.4,12*s,9*s,20*s,4*s,legCol);
  rr(ctx,  2*s-wb*0.4,12*s,9*s,20*s,4*s,legCol);

  // SHOES (cute rounded)
  ctx.fillStyle='#5A3A2A';
  ctx.beginPath();ctx.ellipse(-5*s+wb*0.4,32*s,9*s,4*s,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse( 6*s-wb*0.4,32*s,9*s,4*s,0,0,Math.PI*2);ctx.fill();
  // Shoe highlight
  ctx.fillStyle='rgba(255,255,255,0.18)';
  ctx.beginPath();ctx.ellipse(-6*s+wb*0.4,30*s,4*s,2*s,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse( 5*s-wb*0.4,30*s,4*s,2*s,0,0,Math.PI*2);ctx.fill();

  // TORSO + OUTFIT
  if(c.outfit==='dress'){
    // Bodice
    rr(ctx,-13*s,-13*s,26*s,18*s,7*s,c.outfitColor);
    // Skirt flare
    ctx.fillStyle=c.outfitColor;
    ctx.beginPath();
    ctx.moveTo(-13*s,4*s);ctx.lineTo(-20*s,22*s);ctx.lineTo(20*s,22*s);ctx.lineTo(13*s,4*s);
    ctx.closePath();ctx.fill();
    // Skirt sheen
    ctx.fillStyle='rgba(255,255,255,0.18)';
    ctx.beginPath();ctx.ellipse(0,13*s,10*s,4*s,0,0,Math.PI*2);ctx.fill();
    // Bodice bow/ribbon
    ctx.fillStyle='rgba(255,255,255,0.55)';
    ctx.beginPath();ctx.moveTo(-5*s,-11*s);ctx.lineTo(-9*s,-14*s);ctx.lineTo(-5*s,-8*s);ctx.fill();
    ctx.beginPath();ctx.moveTo( 5*s,-11*s);ctx.lineTo( 9*s,-14*s);ctx.lineTo( 5*s,-8*s);ctx.fill();
    ctx.fillStyle=c.outfitColor2||'rgba(255,255,255,0.6)';
    ctx.beginPath();ctx.arc(0,-11*s,3.5*s,0,Math.PI*2);ctx.fill();
  } else if(c.outfit==='shirt+skirt'){
    rr(ctx,-13*s,-13*s,26*s,16*s,6*s,c.outfitColor);
    ctx.fillStyle=c.outfitColor2||c.outfitColor;
    ctx.beginPath();
    ctx.moveTo(-13*s,2*s);ctx.lineTo(-19*s,22*s);ctx.lineTo(19*s,22*s);ctx.lineTo(13*s,2*s);
    ctx.closePath();ctx.fill();
  } else {
    rr(ctx,-13*s,-13*s,26*s,16*s,6*s,c.outfitColor);
    // Belt (connects shirt hem to pants waistband)
    rr(ctx,-13*s,1*s,26*s,5*s,2*s,c.outfitColor2||'#5A4030');
    // Belt buckle
    rr(ctx,-4*s,1.5*s,8*s,4*s,1*s,'rgba(220,180,80,0.85)');
    // pants
    rr(ctx,-11*s+wb*0.4,4*s,10*s,28*s,5*s,c.outfitColor2||'#8090C0');
    rr(ctx,  1*s-wb*0.4,4*s,10*s,28*s,5*s,c.outfitColor2||'#8090C0');
  }

  // ARMS
  rr(ctx,-22*s,-11*s+wb*0.5,10*s,17*s,5*s,c.skin);
  rr(ctx, 12*s,-11*s-wb*0.5,10*s,17*s,5*s,c.skin);
  // Hands (little circles)
  ctx.fillStyle=c.skin;
  ctx.beginPath();ctx.arc(-17*s,7*s+wb*0.5,5.5*s,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc( 17*s,7*s-wb*0.5,5.5*s,0,Math.PI*2);ctx.fill();

  // NECK
  rr(ctx,-5*s,-16*s,10*s,6*s,3*s,c.skin);

  // HEAD (round, slightly wider — kawaii proportion)
  ctx.fillStyle=c.skin;
  ctx.beginPath();ctx.ellipse(0,-31*s,21*s,22*s,0,0,Math.PI*2);ctx.fill();

  // BLUSH (large soft ovals, very pink)
  ctx.fillStyle='rgba(255,150,155,0.30)';
  ctx.beginPath();ctx.ellipse(-14*s,-27*s,9*s,6*s,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse( 14*s,-27*s,9*s,6*s,0,0,Math.PI*2);ctx.fill();

  // KAWAII EYES
  drawCuteEyes(0,-32*s,c.eyeColor,s);

  // CUTE NOSE (tiny upturned dot)
  ctx.fillStyle='rgba(210,130,130,0.45)';
  ctx.beginPath();ctx.arc(0,-25*s,1.8*s,0,Math.PI*2);ctx.fill();

  // MOUTH (cute w-shape smile)
  ctx.strokeStyle='#C07080';ctx.lineWidth=1.6*s;ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(-5*s,-21*s);
  ctx.quadraticCurveTo(-2.5*s,-19*s,0,-21*s);
  ctx.quadraticCurveTo( 2.5*s,-19*s,5*s,-21*s);
  ctx.stroke();

  // FRONT HAIR (on top of face)
  drawHairFront(c,s);

  // EARRINGS
  if(c.earrings){
    ctx.fillStyle=c.earringColor||'#FFD700';
    ctx.beginPath();ctx.arc(-21*s,-31*s,3.5*s,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc( 21*s,-31*s,3.5*s,0,Math.PI*2);ctx.fill();
    // Earring sparkle
    ctx.fillStyle='rgba(255,255,255,0.7)';
    ctx.beginPath();ctx.arc(-20*s,-32*s,1.2*s,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc( 20*s,-32*s,1.2*s,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

// ── Kawaii anime eyes ───────────────────────────────────────────────────────
function drawCuteEyes(cx,cy,eyeCol,s){
  [-8,8].forEach((ox,idx)=>{
    const ex=cx+ox*s;
    // White sclera (tall oval)
    ctx.fillStyle='white';
    ctx.beginPath();ctx.ellipse(ex,cy,5.5*s,7*s,0,0,Math.PI*2);ctx.fill();
    // Coloured iris
    ctx.fillStyle=eyeCol;
    ctx.beginPath();ctx.ellipse(ex,cy+0.5*s,4.3*s,5.8*s,0,0,Math.PI*2);ctx.fill();
    // Gradient iris (lighter top half)
    const ig=ctx.createRadialGradient(ex,cy-1*s,0.5*s,ex,cy,5*s);
    ig.addColorStop(0,'rgba(255,255,255,0.25)');ig.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=ig;ctx.beginPath();ctx.ellipse(ex,cy+0.5*s,4.3*s,5.8*s,0,0,Math.PI*2);ctx.fill();
    // Pupil (oval, slightly off-centre upward)
    ctx.fillStyle='#111';
    ctx.beginPath();ctx.ellipse(ex,cy-0.5*s,2.8*s,3.6*s,0,0,Math.PI*2);ctx.fill();
    // Large sparkle (top-left)
    ctx.fillStyle='white';
    ctx.beginPath();ctx.ellipse(ex-1.8*s,cy-2.2*s,2*s,2.5*s,-0.3,0,Math.PI*2);ctx.fill();
    // Small sparkle (bottom-right)
    ctx.beginPath();ctx.arc(ex+1.8*s,cy+1.8*s,1*s,0,Math.PI*2);ctx.fill();
    // Top eyelid arc (thicker, defining)
    ctx.strokeStyle='#2A1A2A';ctx.lineWidth=2*s;
    ctx.beginPath();ctx.ellipse(ex,cy-0.5*s,5.5*s,6.5*s,0,Math.PI*1.12,Math.PI*2-0.08);ctx.stroke();
    // Eyelashes (3 tiny radiating lines)
    ctx.strokeStyle='#2A1A2A';ctx.lineWidth=1.3*s;ctx.lineCap='round';
    [[-3.5,-1.2],[0,-1.5],[3.5,-1.2]].forEach(([lx,la])=>{
      ctx.beginPath();
      ctx.moveTo(ex+lx*s,cy-6.5*s);
      ctx.lineTo(ex+(lx+la)*s,cy-8.8*s);
      ctx.stroke();
    });
    // Lower lash (very faint curve)
    ctx.strokeStyle='rgba(180,120,140,0.35)';ctx.lineWidth=1*s;
    ctx.beginPath();ctx.ellipse(ex,cy+2*s,5*s,3.5*s,0,0.12,Math.PI-0.12);ctx.stroke();
  });
}

// ── Hair back layer ─────────────────────────────────────────────────────────
function drawHairBack(c,s){
  const h=c.hair;ctx.fillStyle=h;
  if(c.hairStyle==='slickback'){
    ctx.beginPath();ctx.ellipse(0,-28*s,21*s,26*s,0,0,Math.PI*2);ctx.fill();
  }
  if(c.hairStyle==='straight'||c.hairStyle==='bob'){
    ctx.beginPath();ctx.ellipse(0,-29*s,22*s,28*s,0,0,Math.PI*2);ctx.fill();
  }
  if(c.hairStyle==='ponytail'){
    // Tail flowing back-right
    ctx.beginPath();
    ctx.moveTo(15*s,-46*s);
    ctx.quadraticCurveTo(30*s,-28*s,24*s,8*s);
    ctx.quadraticCurveTo(18*s,18*s,12*s,6*s);
    ctx.quadraticCurveTo(20*s,-24*s,11*s,-45*s);
    ctx.closePath();ctx.fill();
  }
}

// ── Hair front layer ────────────────────────────────────────────────────────
function drawHairFront(c,s){
  const h=c.hair;ctx.fillStyle=h;
  switch(c.hairStyle){
    case 'pigtails':
      // Cap
      ctx.beginPath();ctx.arc(0,-43*s,19*s,Math.PI,0);ctx.fill();
      ctx.fillRect(-19*s,-43*s,38*s,8*s);
      // Fluffy bangs (3 bumps)
      ctx.beginPath();ctx.ellipse(-11*s,-47*s,8*s,6*s,0.2,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(  0,  -49*s,9*s,7*s,  0,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse( 11*s,-47*s,8*s,6*s,-0.2,0,Math.PI*2);ctx.fill();
      // Pigtails (fluffy round)
      ctx.beginPath();ctx.arc(-28*s,-31*s,14*s,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc( 28*s,-31*s,14*s,0,Math.PI*2);ctx.fill();
      // Pigtail inner highlights
      ctx.fillStyle='rgba(255,255,255,0.18)';
      ctx.beginPath();ctx.arc(-28*s,-34*s,7*s,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc( 28*s,-34*s,7*s,0,Math.PI*2);ctx.fill();
      // Scrunchies (coloured band)
      ctx.fillStyle='#FF69B4';
      ctx.beginPath();ctx.ellipse(-23*s,-20*s,6*s,4.5*s,0.5,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse( 23*s,-20*s,6*s,4.5*s,-0.5,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='white';
      ctx.beginPath();ctx.arc(-23*s,-20*s,2*s,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc( 23*s,-20*s,2*s,0,Math.PI*2);ctx.fill();
      break;
    case 'straight':
      ctx.fillStyle=h;
      ctx.beginPath();ctx.arc(0,-43*s,20*s,Math.PI,0);ctx.fill();
      ctx.fillRect(-20*s,-43*s,40*s,10*s);
      // Straight-cut bangs
      rr(ctx,-20*s,-52*s,40*s,15*s,[6,6,0,0],h);
      // Side pieces hanging down
      rr(ctx,-23*s,-41*s,7*s,24*s,[3,3,4,4],h);
      rr(ctx, 16*s,-41*s,7*s,24*s,[3,3,4,4],h);
      // Hair shine
      ctx.fillStyle='rgba(255,255,255,0.18)';
      ctx.beginPath();ctx.ellipse(0,-47*s,12*s,4*s,0,0,Math.PI*2);ctx.fill();
      break;
    case 'bob':
      ctx.fillStyle=h;
      ctx.beginPath();ctx.arc(0,-43*s,21*s,Math.PI,0);ctx.fill();
      ctx.fillRect(-21*s,-43*s,42*s,9*s);
      // Left panel
      ctx.beginPath();
      ctx.moveTo(-20*s,-43*s);ctx.lineTo(-23*s,-25*s);
      ctx.quadraticCurveTo(-23*s,-15*s,-11*s,-15*s);
      ctx.lineTo(-10*s,-30*s);ctx.closePath();ctx.fill();
      // Right panel
      ctx.beginPath();
      ctx.moveTo(20*s,-43*s);ctx.lineTo(23*s,-25*s);
      ctx.quadraticCurveTo(23*s,-15*s,11*s,-15*s);
      ctx.lineTo(10*s,-30*s);ctx.closePath();ctx.fill();
      // Bottom connecting strip (covers any gap between panels)
      ctx.fillRect(-11*s,-16*s,22*s,2*s);
      // Bangs (no separate chin line needed — panels connect smoothly)
      rr(ctx,-20*s,-52*s,40*s,15*s,[6,6,0,0],h);
      // Hair shine
      ctx.fillStyle='rgba(255,255,255,0.18)';
      ctx.beginPath();ctx.ellipse(0,-48*s,12*s,4*s,0,0,Math.PI*2);ctx.fill();
      // Cute side clip
      ctx.fillStyle='#FF69B4';
      ctx.beginPath();ctx.arc(14*s,-46*s,5*s,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='white';ctx.beginPath();ctx.arc(14*s,-46*s,2.5*s,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#FF69B4';ctx.beginPath();ctx.arc(14*s,-46*s,1*s,0,Math.PI*2);ctx.fill();
      break;
    case 'curly':
      ctx.fillStyle=h;
      ctx.beginPath();ctx.arc(0,-44*s,20*s,Math.PI,0);ctx.fill();
      ctx.fillRect(-20*s,-44*s,40*s,8*s);
      // Ringlets: arc around top & sides
      [[-19,-49],[-11,-53],[0,-55],[11,-53],[19,-49],
       [-24,-41],[-26,-32],[24,-41],[26,-32],
       [-22,-23],[22,-23]].forEach(([ox,oy])=>{
        ctx.beginPath();ctx.arc(ox*s,oy*s,7.5*s,0,Math.PI*2);ctx.fill();
      });
      // Curl highlights
      ctx.fillStyle='rgba(255,255,255,0.16)';
      [[-19,-52],[0,-57],[19,-52]].forEach(([ox,oy])=>{
        ctx.beginPath();ctx.arc(ox*s,oy*s,4*s,0,Math.PI*2);ctx.fill();
      });
      break;
    case 'ponytail':
      ctx.fillStyle=h;
      ctx.beginPath();ctx.arc(0,-43*s,19*s,Math.PI,0);ctx.fill();
      ctx.fillRect(-19*s,-43*s,38*s,9*s);
      // Bangs
      rr(ctx,-18*s,-52*s,36*s,14*s,[5,5,0,0],h);
      // Ponytail base bump
      ctx.beginPath();ctx.arc(15*s,-47*s,7*s,0,Math.PI*2);ctx.fill();
      // Hair shine
      ctx.fillStyle='rgba(255,255,255,0.18)';
      ctx.beginPath();ctx.ellipse(0,-48*s,10*s,3*s,0,0,Math.PI*2);ctx.fill();
      // Bow (pink ribbon)
      ctx.fillStyle='#FF69B4';
      ctx.beginPath();ctx.moveTo(10*s,-51*s);ctx.lineTo(4*s,-47*s);ctx.lineTo(10*s,-43*s);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.moveTo(20*s,-51*s);ctx.lineTo(26*s,-47*s);ctx.lineTo(20*s,-43*s);ctx.closePath();ctx.fill();
      ctx.fillStyle='white';ctx.beginPath();ctx.arc(15*s,-47*s,3*s,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#FF69B4';ctx.beginPath();ctx.arc(15*s,-47*s,1.5*s,0,Math.PI*2);ctx.fill();
      break;

    case 'short':
      ctx.fillStyle=h;
      ctx.beginPath();ctx.arc(0,-44*s,18*s,Math.PI,0);ctx.fill();
      ctx.fillRect(-18*s,-44*s,36*s,7*s);
      rr(ctx,-21*s,-43*s,6*s,14*s,[2,2,4,4],h);
      rr(ctx,15*s,-43*s,6*s,14*s,[2,2,4,4],h);
      rr(ctx,-17*s,-50*s,28*s,10*s,[4,4,0,0],h);
      ctx.fillStyle='rgba(255,255,255,0.15)';
      ctx.beginPath();ctx.ellipse(-2*s,-48*s,9*s,3*s,0,0,Math.PI*2);ctx.fill();
      break;

    case 'spiky':
      ctx.fillStyle=h;
      ctx.beginPath();ctx.arc(0,-44*s,18*s,Math.PI,0);ctx.fill();
      ctx.fillRect(-18*s,-44*s,36*s,7*s);
      [[-14,-48],[-7,-53],[0,-56],[7,-53],[14,-48]].forEach(function(p){
        ctx.beginPath();ctx.moveTo((p[0]-5)*s,-38*s);ctx.lineTo(p[0]*s,p[1]*s);ctx.lineTo((p[0]+5)*s,-38*s);ctx.closePath();ctx.fill();
      });
      ctx.beginPath();ctx.moveTo(-18*s,-38*s);ctx.lineTo(-22*s,-50*s);ctx.lineTo(-14*s,-38*s);ctx.closePath();ctx.fill();
      break;

    case 'slickback':
      ctx.fillStyle=h;
      ctx.beginPath();ctx.arc(0,-44*s,18*s,Math.PI,0);ctx.fill();
      ctx.fillRect(-18*s,-44*s,36*s,8*s);
      ctx.beginPath();ctx.moveTo(-18*s,-44*s);ctx.quadraticCurveTo(-10*s,-55*s,0,-52*s);ctx.quadraticCurveTo(10*s,-55*s,18*s,-44*s);ctx.closePath();ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.15)';
      ctx.beginPath();ctx.ellipse(0,-50*s,10*s,3*s,0,0,Math.PI*2);ctx.fill();
      break;

    case 'sidepart':
      ctx.fillStyle=h;
      ctx.beginPath();ctx.arc(0,-44*s,19*s,Math.PI,0);ctx.fill();
      ctx.fillRect(-19*s,-44*s,38*s,9*s);
      ctx.beginPath();ctx.moveTo(-19*s,-52*s);ctx.lineTo(10*s,-52*s);ctx.quadraticCurveTo(14*s,-52*s,18*s,-46*s);ctx.lineTo(-19*s,-44*s);ctx.closePath();ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.lineWidth=1.5*s;
      ctx.beginPath();ctx.moveTo(-6*s,-53*s);ctx.lineTo(-6*s,-44*s);ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,0.15)';
      ctx.beginPath();ctx.ellipse(4*s,-49*s,10*s,3*s,-0.2,0,Math.PI*2);ctx.fill();
      break;
  }
}


function drawPet(px,py,type,color){
  ctx.save();ctx.translate(px,py);
  if(type==='cat'){
    // body
    rr(ctx,-14,-10,28,20,8,color);
    // head
    ctx.beginPath();ctx.ellipse(0,-18,12,11,0,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();
    // ears
    ctx.fillStyle=color;
    ctx.beginPath();ctx.moveTo(-10,-26);ctx.lineTo(-14,-34);ctx.lineTo(-4,-26);ctx.fill();
    ctx.beginPath();ctx.moveTo(10,-26);ctx.lineTo(14,-34);ctx.lineTo(4,-26);ctx.fill();
    // face
    ctx.beginPath();ctx.ellipse(-4,-18,2.5,3,0,0,Math.PI*2);ctx.fillStyle='#333';ctx.fill();
    ctx.beginPath();ctx.ellipse(4,-18,2.5,3,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(0,-14,3,0.1,Math.PI-0.1);ctx.strokeStyle='#d06070';ctx.lineWidth=1.5;ctx.stroke();
    // tail
    ctx.beginPath();ctx.moveTo(14,0);ctx.quadraticCurveTo(24,-10,20,-18);ctx.strokeStyle=color;ctx.lineWidth=5;ctx.stroke();
  } else if(type==='dog'){
    rr(ctx,-15,-8,30,18,9,color);
    ctx.beginPath();ctx.ellipse(0,-16,13,10,0,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();
    // floppy ears
    ctx.fillStyle=color;
    rr(ctx,-18,-22,10,14,5,color);
    rr(ctx,8,-22,10,14,5,color);
    ctx.beginPath();ctx.ellipse(-4,-16,2.5,3,0,0,Math.PI*2);ctx.fillStyle='#333';ctx.fill();
    ctx.beginPath();ctx.ellipse(4,-16,2.5,3,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(0,-11,4,3,0,0,Math.PI*2);ctx.fillStyle='#d08080';ctx.fill();
  } else if(type==='bunny'){
    rr(ctx,-12,-8,24,18,8,color);
    ctx.beginPath();ctx.ellipse(0,-16,11,10,0,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();
    // tall ears
    rr(ctx,-8,-38,6,22,3,color);
    rr(ctx,2,-38,6,22,3,color);
    rr(ctx,-7,-36,4,18,2,'#FFB3D9');
    rr(ctx,3,-36,4,18,2,'#FFB3D9');
    ctx.beginPath();ctx.ellipse(-3,-16,2.5,3,0,0,Math.PI*2);ctx.fillStyle='#333';ctx.fill();
    ctx.beginPath();ctx.ellipse(3,-16,2.5,3,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(0,-12,2,0.2,Math.PI-0.2);ctx.strokeStyle='#d06070';ctx.lineWidth=1.5;ctx.stroke();
  } else if(type==='bird'){
    // body oval
    ctx.beginPath();ctx.ellipse(0,-4,10,14,0,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();
    // head
    ctx.beginPath();ctx.ellipse(0,-20,8,8,0,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();
    // beak
    ctx.fillStyle='#FFD060';
    ctx.beginPath();ctx.moveTo(8,-20);ctx.lineTo(14,-18);ctx.lineTo(8,-16);ctx.fill();
    // eye
    ctx.beginPath();ctx.arc(-2,-20,2.5,0,Math.PI*2);ctx.fillStyle='#333';ctx.fill();
    // wing
    ctx.beginPath();ctx.ellipse(-10,0,6,10,0.5,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();
  } else if(type==='hamster'){
    // chubby
    ctx.beginPath();ctx.ellipse(0,-4,14,12,0,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();
    // head
    ctx.beginPath();ctx.ellipse(0,-20,12,11,0,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();
    // chubby cheeks
    ctx.beginPath();ctx.ellipse(-14,-18,8,6,0,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();
    ctx.beginPath();ctx.ellipse(14,-18,8,6,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(-3,-20,2.5,3,0,0,Math.PI*2);ctx.fillStyle='#333';ctx.fill();
    ctx.beginPath();ctx.ellipse(3,-20,2.5,3,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(0,-16,3,0.1,Math.PI-0.1);ctx.strokeStyle='#d06070';ctx.lineWidth=1.5;ctx.stroke();
    // ears
    ctx.beginPath();ctx.arc(-9,-28,5,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();
    ctx.beginPath();ctx.arc(9,-28,5,0,Math.PI*2);ctx.fill();
  } else if(type==='duck'){
    rr(ctx,-14,-6,28,16,9,color);
    ctx.beginPath();ctx.ellipse(0,-18,10,9,0,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();
    ctx.fillStyle='#FFD060';
    ctx.beginPath();ctx.moveTo(10,-18);ctx.lineTo(17,-15);ctx.lineTo(10,-12);ctx.fill();
    ctx.beginPath();ctx.arc(-2,-18,2.5,0,Math.PI*2);ctx.fillStyle='#333';ctx.fill();
    ctx.fillStyle='#FFD060';
    rr(ctx,-8,8,16,8,4,'#FFD060');
  } else if(type==='turtle'){
    // shell
    ctx.beginPath();ctx.ellipse(0,-2,18,12,0,0,Math.PI*2);ctx.fillStyle='#4CAF50';ctx.fill();
    // shell pattern
    ctx.strokeStyle='#388E3C';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.ellipse(0,-2,10,7,0,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-8,-2);ctx.lineTo(8,-2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,-9);ctx.lineTo(0,5);ctx.stroke();
    // head
    ctx.beginPath();ctx.ellipse(18,-4,8,7,0.2,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();
    // deadpan face - straight line mouth
    ctx.beginPath();ctx.moveTo(14,-4);ctx.lineTo(22,-4);ctx.strokeStyle='#555';ctx.lineWidth=1.5;ctx.stroke();
    // eye
    ctx.beginPath();ctx.arc(20,-6,2,0,Math.PI*2);ctx.fillStyle='#333';ctx.fill();
    // legs
    ctx.fillStyle=color;
    ctx.beginPath();ctx.ellipse(-10,10,6,4,0.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(8,10,6,4,-0.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(-14,-2,4,6,0.8,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

let theaterAnim=0; // frame counter for animations

function drawTheater(){
  // Background — dark cinema
  ctx.fillStyle='#1A0A20';ctx.fillRect(0,0,W,H);
  // Ceiling lights
  for(let i=0;i<8;i++){
    ctx.fillStyle='rgba(255,220,150,0.4)';
    ctx.beginPath();ctx.arc(50+i*100,15,8,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,220,150,0.15)';
    ctx.beginPath();ctx.arc(50+i*100,30,20,0,Math.PI*2);ctx.fill();
  }
  // Screen frame
  rr(ctx,80,50,640,350,8,'#222');
  rr(ctx,86,56,628,338,4,'#111');
  // Movie screen glow
  ctx.fillStyle='rgba(255,240,220,0.03)';ctx.fillRect(86,56,628,338);

  // Draw current movie art centered on screen
  const movie=MOVIES[theaterSlide];
  const artX=290,artY=80,artW=220,artH=200;
  // Art frame
  rr(ctx,artX-4,artY-4,artW+8,artH+8,4,'#333');
  movie.draw(artX,artY);
  // Movie poster overlay text
  ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(artX,artY+artH-50,artW,50);
  ctx.font='bold 15px Segoe UI';ctx.fillStyle='white';ctx.textAlign='center';
  ctx.fillText(movie.title,artX+artW/2,artY+artH-30);
  ctx.font='11px Segoe UI';ctx.fillStyle='rgba(255,255,255,0.7)';
  ctx.fillText(movie.year,artX+artW/2,artY+artH-14);

  // Catchphrase on screen (below art)
  rr(ctx,120,295,560,80,10,'rgba(255,255,255,0.08)');
  ctx.font='italic 15px Segoe UI';ctx.fillStyle='rgba(255,255,220,0.9)';ctx.textAlign='center';
  const lines=movie.phrase.split('\n');
  lines.forEach((ln,i)=>ctx.fillText(ln,W/2,325+i*22));

  // Curtains
  const curtainWave=Math.sin(theaterAnim*0.02)*4;
  // Left curtain
  ctx.fillStyle='#8B0020';
  ctx.beginPath();
  ctx.moveTo(0,40);
  for(let y=40;y<H-80;y+=20){ctx.lineTo(80+Math.sin((y+theaterAnim)*0.08)*10+curtainWave,y);}
  ctx.lineTo(80,H-80);ctx.lineTo(0,H-80);ctx.closePath();ctx.fill();
  // Right curtain
  ctx.beginPath();
  ctx.moveTo(W,40);
  for(let y=40;y<H-80;y+=20){ctx.lineTo(W-80+Math.sin((y+theaterAnim)*0.08)*10-curtainWave,y);}
  ctx.lineTo(W-80,H-80);ctx.lineTo(W,H-80);ctx.closePath();ctx.fill();
  // Curtain gold trim
  ctx.strokeStyle='#FFD700';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(0,40);ctx.lineTo(80,40);ctx.lineTo(80,H-80);ctx.stroke();
  ctx.beginPath();ctx.moveTo(W,40);ctx.lineTo(W-80,40);ctx.lineTo(W-80,H-80);ctx.stroke();

  // Seats (bottom section)
  ctx.fillStyle='#3A0010';ctx.fillRect(0,H-90,W,90);
  for(let col=0;col<10;col++){
    for(let row=0;row<2;row++){
      rr(ctx,30+col*74,H-82+row*38,58,32,[8,8,2,2],'#600020');
    }
  }

  // Navigation arrows
  ctx.fillStyle='rgba(255,255,255,0.15)';
  rr(ctx,88,200,42,42,21,'rgba(255,255,255,0.15)');
  rr(ctx,670,200,42,42,21,'rgba(255,255,255,0.15)');
  ctx.font='bold 22px Arial';ctx.fillStyle='rgba(255,255,255,0.7)';ctx.textAlign='center';
  ctx.fillText('◀',109,225);ctx.fillText('▶',691,225);
  // Film counter
  ctx.font='12px Segoe UI';ctx.fillStyle='rgba(255,255,255,0.5)';
  ctx.fillText((theaterSlide+1)+' / '+MOVIES.length,W/2,395);
  // Hint
  ctx.font='11px Segoe UI';ctx.fillStyle='rgba(255,255,200,0.5)';
  ctx.fillText('◀ ▶ arrows to browse movies',W/2,420);

  theaterAnim++;
}

function getCupSize(s){return s==='S'?0.7:s==='L'?1.3:1;}
function drawBobaCup(cup,selected=false){
  const {x,y,flavor,topping,size}=cup;
  if(cup.empty){
    // Draw empty cup with straw
    const sc=getCupSize(size);
    ctx.fillStyle='rgba(255,255,255,0.5)';
    ctx.beginPath();
    ctx.moveTo(x-20*sc,y-30*sc);ctx.lineTo(x-14*sc,y+24*sc);
    ctx.lineTo(x+14*sc,y+24*sc);ctx.lineTo(x+20*sc,y-30*sc);
    ctx.closePath();ctx.fill();
    ctx.strokeStyle='#DDD';ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle='#CCC';ctx.fillRect(x+6*sc,y-46*sc,3*sc,26*sc); // straw
    ctx.font=`${16*sc}px serif`;ctx.textAlign='center';
    ctx.fillText('😊',x,y+5);
    return;
  }
  const sc=getCupSize(size);
  const w=38*sc,h=60*sc;
  ctx.save();ctx.translate(x,y);
  // cup shadow
  ctx.beginPath();ctx.ellipse(0,h/2+4,w/2+2,5,0,0,Math.PI*2);ctx.fillStyle='rgba(0,0,0,0.15)';ctx.fill();
  // cup shape (trapezoid)
  ctx.beginPath();
  ctx.moveTo(-w/2+4,h/2);ctx.lineTo(w/2-4,h/2);
  ctx.lineTo(w/2,h/2-h+8);ctx.lineTo(-w/2,h/2-h+8);
  ctx.closePath();ctx.fillStyle='rgba(255,255,255,0.85)';ctx.fill();
  // liquid
  ctx.beginPath();
  ctx.moveTo(-w/2+6,h/2-4);ctx.lineTo(w/2-6,h/2-4);
  ctx.lineTo(w/2+1,h/2-h+12);ctx.lineTo(-w/2-1,h/2-h+12);
  ctx.closePath();ctx.fillStyle=BOBA_FLAVOR_COLORS[flavor]+'CC';ctx.fill();

  if(topping===0){// boba pearls
    for(let i=0;i<5;i++){
      ctx.beginPath();ctx.arc((i-2)*6*sc,h/2-8*sc,4*sc,0,Math.PI*2);
      ctx.fillStyle='#3A2010';ctx.fill();

    rr(ctx,-14*sc,h/2-16*sc,28*sc,10*sc,3,'#3D6B3D');

    for(let i=0;i<4;i++){

      ctx.fillStyle='rgba(255,180,190,0.7)';ctx.fill();

  ctx.beginPath();ctx.ellipse(0,-h/2+6*sc,w/2+2,5*sc,0,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,0.95)';ctx.fill();
  ctx.beginPath();ctx.ellipse(0,-h/2+6*sc,w/2,3*sc,0,0,Math.PI*2);ctx.strokeStyle='#ddd';ctx.lineWidth=1;ctx.stroke();
  // straw
  ctx.strokeStyle='#FF80A0';ctx.lineWidth=4*sc;
  ctx.beginPath();ctx.moveTo(8*sc,-h/2);ctx.lineTo(14*sc,-h/2-28*sc);ctx.stroke();
  if(selected){
    ctx.strokeStyle='#FFD700';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(0,0,Math.max(w,h)/2+6,0,Math.PI*2);ctx.stroke();
  }
  ctx.restore();
}

  ctx.arc(cup.x, cup.y, 32, -Math.PI/2, -Math.PI/2 + progress*Math.PI*2);
  ctx.stroke();
  // Bubble particles rising
  drinkParticles.forEach((p,i)=>{
    ctx.globalAlpha=p.alpha;
    ctx.fillStyle=p.col;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fill();
    p.y -= 1.5; p.x += Math.sin(p.y*0.1)*0.5;
    p.alpha -= 0.018; p.r *= 0.99;
  });
  ctx.globalAlpha=1;
  drinkParticles = drinkParticles.filter(p=>p.alpha>0);
  // Spawn bubbles while drinking
  if(Math.random()<0.3){
    const sc=getCupSize(cup.size);
    drinkParticles.push({
      x: cup.x+(Math.random()-0.5)*20*sc,
      y: cup.y-20*sc,
      r: 3+Math.random()*5,
      alpha: 0.8,
      col: ['#FFB3D9','#B3D9FF','#B3FFD9','#FFD9B3'][Math.floor(Math.random()*4)]
    });
  }
  ctx.restore();
}
function showSpeech(x, y, lines, duration=3800) {
  speechBubble = { x, y, lines: Array.isArray(lines)?lines:[lines], alpha:1, timer:duration };
}

function drawSpeechBubble() {
  if (!speechBubble || speechBubble.alpha <= 0) return;
  const b = speechBubble;
  const PAD = 14, LINE_H = 18, MAX_W = 220;
  ctx.save();
  ctx.font = '13px Segoe UI';
  const maxW = Math.min(MAX_W, Math.max(...b.lines.map(l => ctx.measureText(l).width)) + PAD*2);
  const bh = b.lines.length * LINE_H + PAD*2;
  let bx = Math.min(b.x - maxW/2, W - maxW - 8);
  bx = Math.max(bx, 8);
  const by = b.y - bh - 22;
  ctx.globalAlpha = Math.min(1, b.alpha);
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  ctx.beginPath(); ctx.roundRect(bx+3, by+3, maxW, bh, 12); ctx.fill();
  // Bubble body
  ctx.fillStyle = 'white';
  ctx.beginPath(); ctx.roundRect(bx, by, maxW, bh, 12); ctx.fill();
  ctx.strokeStyle = '#FFB3D9'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(bx, by, maxW, bh, 12); ctx.stroke();
  // Tail (pointing down toward character)
  ctx.fillStyle = 'white';
  ctx.beginPath();
  ctx.moveTo(b.x - 8, by + bh);
  ctx.lineTo(b.x, by + bh + 14);
  ctx.lineTo(b.x + 8, by + bh);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#FFB3D9'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(b.x - 8, by + bh + 1);
  ctx.lineTo(b.x, by + bh + 14);
  ctx.lineTo(b.x + 8, by + bh + 1);
  ctx.stroke();
  // Text
  ctx.fillStyle = '#333'; ctx.textAlign = 'left';
  b.lines.forEach((line, i) => {
    ctx.fillText(line, bx + PAD, by + PAD + 13 + i * LINE_H);
  });
  ctx.restore();
  // Fade out
  b.timer -= 16;
  if (b.timer < 800) b.alpha = b.timer / 800;
  if (b.timer <= 0) speechBubble = null;
}

// ── Synthesise a little "talking" sound ──────────────────────────────────────
function playTalkSound() {
  try {
    const ac = getAC();
    if (!ac || ac.state === 'suspended') return;
    const pitches = [420, 480, 380, 520, 440];
    const p = pitches[Math.floor(Math.random() * pitches.length)];
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.value = p;
    g.gain.setValueAtTime(0.08, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.12);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + 0.14);
    // Second bleep slightly after
    setTimeout(() => {
      const o2 = ac.createOscillator(), g2 = ac.createGain();
      o2.type = 'sine'; o2.frequency.value = p * 1.2;
      g2.gain.setValueAtTime(0.06, ac.currentTime);
      g2.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.08);
      o2.connect(g2); g2.connect(ac.destination);
      o2.start(); o2.stop(ac.currentTime + 0.1);
    }, 90);
  } catch(e) {}
}


function drawKokeshi(x,y,doll,sc=1){
  ctx.save();ctx.translate(x,y);
  // body
  rr(ctx,-12*sc,0,24*sc,36*sc,[12,12,8,8]*sc,doll.body);
  // dress pattern
  if(doll.pattern==='dots'){
    for(let i=0;i<6;i++){
      ctx.beginPath();ctx.arc((i%3-1)*7*sc,10*sc+Math.floor(i/3)*10*sc,2*sc,0,Math.PI*2);
      ctx.fillStyle=doll.dress;ctx.fill();
    }
  } else if(doll.pattern==='stars'){
    ctx.fillStyle=doll.dress;ctx.font=`${10*sc}px serif`;ctx.textAlign='center';
    ['★','★','★'].forEach((s,i)=>ctx.fillText(s,(i-1)*8*sc,24*sc));
  } else if(doll.pattern==='flowers'){
    ctx.fillStyle=doll.dress;ctx.font=`${10*sc}px serif`;ctx.textAlign='center';
    ['🌸','🌸'].forEach((s,i)=>ctx.fillText(s,(i-0.5)*12*sc,22*sc));
  } else {
    ctx.fillStyle=doll.dress+'80';
    ctx.fillRect(-8*sc,6*sc,16*sc,24*sc);
  }
  // head
  ctx.beginPath();ctx.arc(0,-14*sc,12*sc,0,Math.PI*2);ctx.fillStyle=doll.body;ctx.fill();
  // hair cap
  ctx.beginPath();ctx.arc(0,-18*sc,12*sc,Math.PI,Math.PI*2);ctx.fillStyle=doll.hair;ctx.fill();
  rr(ctx,-12*sc,-20*sc,24*sc,8*sc,4*sc,doll.hair);
  // face
  ctx.beginPath();ctx.arc(-4*sc,-14*sc,2*sc,0,Math.PI*2);ctx.fillStyle='#333';ctx.fill();
  ctx.beginPath();ctx.arc(4*sc,-14*sc,2*sc,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(0,-10*sc,3*sc,0.1,Math.PI-0.1);ctx.strokeStyle='#d06070';ctx.lineWidth=1;ctx.stroke();
  ctx.restore();
}

// ─── INPUT ────────────────────────────────────────────────────────────────────
let mouseX=0,mouseY=0;

// Universal canvas coordinate extractor (handles CSS scaling for mobile)
function getPos(e){
  const r=canvas.getBoundingClientRect();
  const scaleX=800/r.width, scaleY=560/r.height;
  const src=e.touches?e.touches[0]:e.changedTouches?e.changedTouches[0]:e;
  return {x:(src.clientX-r.left)*scaleX, y:(src.clientY-r.top)*scaleY};
}

// ─── UNIFIED POINTER SYSTEM ─────────────────────────────────────────────────
// Three gesture types:
//   TAP   = down+up with <15px movement and <350ms hold → fires click
//   DRAG  = down+move >15px → moves draggable items, NO click on release
//   HOLD  = down, no significant move, >350ms → hold-to-drink boba

let _px=0,_py=0,_pt=0;   // pointer down position + timestamp
let _moved=false;          // has pointer moved more than threshold?
let _activelyDragging=false; // are we actually moving something?

function _resetPointer(x,y){
  _px=x;_py=y;_pt=Date.now();_moved=false;_activelyDragging=false;
}

function _tryStartDrag(x,y){
  // Returns true if something started dragging
  if(scene==='home'){
    for(let i=furniture.length-1;i>=0;i--){
      const f=furniture[i];
      if(Math.abs(x-f.x)<56&&Math.abs(y-f.y)<56){
        if(editMode){furniture.splice(i,1);notify('Removed!');return false;}
        dragFurn=f;dragOX=f.x-x;dragOY=f.y-y;return true;
      }
    }
  }
  if(scene==='boba'){
    for(let i=bobaCups.length-1;i>=0;i--){
      const cup=bobaCups[i];const sc=getCupSize(cup.size);
      if(Math.abs(x-cup.x)<30*sc&&Math.abs(y-cup.y)<40*sc){
        dragCup=cup;dragCupOX=cup.x-x;dragCupOY=cup.y-y;return true;
      }
    }
    if(fridgeOpen){
      for(const fi of fridgeItems){
        if(Math.abs(x-fi.x)<22&&Math.abs(y-fi.y)<22){dragFridgeItem=fi;return true;}
      }
    }
  }
  if(scene==='apartments'){
    for(const gi of giftItems){
      if(Math.abs(x-gi.x)<24&&Math.abs(y-gi.y)<24){
        dragGift=gi;dragGiftOX=gi.x-x;dragGiftOY=gi.y-y;return true;
      }
    }
  }
  for(let i=worldDolls.length-1;i>=0;i--){
    const wd=worldDolls[i];
    if(Math.abs(x-wd.x)<22&&Math.abs(y-wd.y)<32){
      wd._drag=true;wd._ox=wd.x-x;wd._oy=wd.y-y;return true;
    }
  }
  return false;
}

function pointerDown(x,y){
  _resetPointer(x,y);
  if(!MUS.ready) MUS.init();
  // Start boba drink-hold tracking regardless (cleared if dragged away)
  if(scene==='boba'){
    for(let i=bobaCups.length-1;i>=0;i--){
      const cup=bobaCups[i];const sc=getCupSize(cup.size);
      if(Math.abs(x-cup.x)<30*sc&&Math.abs(y-cup.y)<40*sc){
        drinkHold={cup,startTime:Date.now(),progress:0};break;
      }
    }
  }
}

function pointerMove(x,y){
  mouseX=x;mouseY=y;
  const dist=Math.sqrt((x-_px)**2+(y-_py)**2);
  if(dist>15 && !_moved){
    _moved=true;
    // Start drag on first significant movement
    if(!_activelyDragging){
      _activelyDragging=_tryStartDrag(_px,_py);
      // Cancel drink-hold if we're dragging
      if(_activelyDragging) drinkHold=null;
    }
  }
  if(_activelyDragging){
    if(dragFurn) {dragFurn.x=x+dragOX;dragFurn.y=y+dragOY;}
    if(dragCup)  {dragCup.x=x+dragCupOX;dragCup.y=y+dragCupOY;}
    if(dragGift) {dragGift.x=x+dragGiftOX;dragGift.y=y+dragGiftOY;}
    if(dragFridgeItem){dragFridgeItem.x=x;dragFridgeItem.y=y;}
    for(const wd of worldDolls){if(wd._drag){wd.x=x+(wd._ox||0);wd.y=y+(wd._oy||0);}}
  }
}

function pointerUp(x,y){
  const holdMs=Date.now()-_pt;

  // ── Drink completion ──────────────────────────────────────────────────────
  if(drinkHold){
    if(drinkHold.progress>=0.99){
      const cup=drinkHold.cup;cup.empty=true;
      playDrinkSound();notify('Slurp! 🧋 Delicious!');
      setTimeout(()=>{cup.empty=false;},2000);
    }
    drinkHold=null;drinkParticles=[];
  }

  // ── End all drags ─────────────────────────────────────────────────────────
  dragFurn=null;dragCup=null;dragFridgeItem=null;
  for(const wd of worldDolls) wd._drag=false;
  if(dragGift){
    APT_DOORS.forEach(door=>{
      if(Math.abs(dragGift.x-door.x)<75&&dragGift.y>180&&dragGift.y<440)
        notify('Gift '+dragGift.emoji+' given to '+door.resident+'! 🎁');
    });
    dragGift=null;
  }

  // ── TAP → click ──────────────────────────────────────────────────────────
  // Fire click if: didn't drag AND either quick tap OR short hold on non-cup
  const wasTap = !_moved;
  const wasBriefHold = holdMs < 350 && !_moved;
  if(wasTap || wasBriefHold) handleClick(_px,_py); // use DOWN coords for accuracy
}

function cancelPointer(){
  drinkHold=null;drinkParticles=[];
  dragFurn=null;dragCup=null;dragGift=null;dragFridgeItem=null;
  for(const wd of worldDolls) wd._drag=false;
  _moved=false;_activelyDragging=false;
}

// ── Mouse events ─────────────────────────────────────────────────────────────
canvas.addEventListener('mousedown', e=>{ const p=getPos(e); pointerDown(p.x,p.y); });
canvas.addEventListener('mousemove', e=>{ const p=getPos(e); pointerMove(p.x,p.y); });
canvas.addEventListener('mouseup',   e=>{ const p=getPos(e); pointerUp(p.x,p.y); });

// ── Touch events (prevent scroll/zoom on canvas) ──────────────────────────
canvas.addEventListener('touchstart', e=>{
  e.preventDefault();const p=getPos(e);pointerDown(p.x,p.y);
},{passive:false});
canvas.addEventListener('touchmove', e=>{
  e.preventDefault();const p=getPos(e);pointerMove(p.x,p.y);
},{passive:false});
canvas.addEventListener('touchend', e=>{
  e.preventDefault();const p=getPos(e);pointerUp(p.x,p.y);
},{passive:false});
canvas.addEventListener('touchcancel', e=>{cancelPointer();},{passive:false});

function handleClick(mx,my){
  if(checkResetClick(mx,my)) return;
  // Pet click
  if(pet&&Math.abs(mx-pet.x)<25&&Math.abs(my-pet.y)<25){
    petSound(pet.type);
    if(pet.type==='turtle')notify('Meh!');
    createPetColorPanel(pet.type);return;
  }
  // Kokeshi hidden spots
  KOKESHI_HIDDEN.forEach((spot,i)=>{
    if(spot.scene===scene&&!kokeshiFound[i]&&Math.abs(mx-spot.x)<24&&Math.abs(my-spot.y)<24){
      if(spot.requires&&!spot.requires()){notify(spot.hint||'Complete more to find this doll! 🪆');return;}
      kokeshiFound[i]=true;
      notify('Found '+KOKESHI_DEFS[i].name+'! 🎎');
    }
  });
  // World dolls click
  for(let i=worldDolls.length-1;i>=0;i--){
    const wd=worldDolls[i];
    if(Math.abs(mx-wd.x)<18&&Math.abs(my-wd.y-18)<30){
      worldDolls.splice(i,1);notify('Put back!');return;
    }
  }

  if(scene==='town'){
    // building click
    for(let b of BUILDINGS){
      if(mx>b.cx-52&&mx<b.cx+52&&my>BY&&my<BY+BH+20){
        scene=b.scene;startTheme(b.scene);updateHUD();closeAllPanels();
        char.x=400;char.y=400;char.tx=400;char.ty=400;
        notify('Entering '+b.name+'!');return;
      }
    }
    // walk
    char.tx=mx;char.ty=Math.min(Math.max(my,BY+BH+30),H-30);
  } else if(scene==='home'){
    char.tx=mx;char.ty=Math.min(Math.max(my,60),H-30);
  } else if(scene==='boba'){
    // Bob the shopkeeper (drawn at x=490 y=265)
    if(Math.abs(mx-490)<45 && my>200 && my<330){
      showSpeech(490,220,pickLine(NPC_LINES.bob));playTalkSound();return;
    }
    // Order button
    if(mx>20&&mx<150&&my>450&&my<486){
      bobaCups.push({x:300+Math.random()*200,y:320+Math.random()*30,
        flavor:Math.floor(Math.random()*6),topping:Math.floor(Math.random()*4),size:'M'});
      notify('Boba ordered! 🧋');return;
    }
    // Fridge click
    if(mx>620&&mx<760&&my>150&&my<330){
      fridgeOpen=!fridgeOpen;notify(fridgeOpen?'Fridge open!':'Fridge closed!');return;
    }
    // Cup click (if not dragging)
    for(let cup of bobaCups){
      const sc=getCupSize(cup.size);
      if(Math.abs(mx-cup.x)<24*sc&&Math.abs(my-cup.y)<35*sc){
        closeBobaPanel();createBobaPanel(cup);return;
      }
    }
    char.tx=mx;char.ty=Math.min(Math.max(my,60),H-30);
  } else if(scene==='sushi'){
    // Sushi chef drawn at x=105 y=345
    if(Math.abs(mx-105)<42 && my>265 && my<410){
      showSpeech(105,310,pickLine(NPC_LINES.chef));playTalkSound();return;
    }
    // Bento button
    if(mx>20&&mx<180&&my>450&&my<486){
      if(!bentoPanel){bentoPanel=true;createBentoPanel();}return;
    }
    // Chest
    if(mx>360&&mx<440&&my>400&&my<460){
      chestOpen=!chestOpen;
      if(chestOpen)chestEmoji=CHEST_ITEMS[Math.floor(Math.random()*CHEST_ITEMS.length)];
      notify(chestOpen?'You found '+chestEmoji+'!':'Chest closed.');return;
    }
    // Plates
    for(let plate of conveyorPlates){
      if(Math.abs(mx-plate.x)<36&&Math.abs(my-310)<18){
        plate.revealed=!plate.revealed;
        if(plate.revealed)notify('Got '+plate.item+'!');return;
      }
    }
    char.tx=mx;char.ty=Math.min(Math.max(my,60),H-30);
  } else if(scene==='apartments'){
    // Door click
    for(let door of APT_DOORS){
      if(Math.abs(mx-door.x)<50&&my>200&&my<400){
        // Click on open resident chibi
        if(door.open && Math.abs(mx-door.x)<30 && my>230 && my<360){
          const idx=APT_DOORS.indexOf(door);
          const pool=[NPC_LINES.luna,NPC_LINES.stella,NPC_LINES.sunny][idx];
          showSpeech(door.x, 290, pickLine(pool)); playTalkSound(); return;
        }
        door.open=!door.open;notify(door.open?door.resident+' opens the door!':'Door closes.');return;
      }
    }
    char.tx=mx;char.ty=Math.min(Math.max(my,60),H-30);
  } else if(scene==='petshop'){
    // Mochi pet shop owner drawn at x=400 y=458
    if(Math.abs(mx-400)<50 && my>410 && my<515){
      showSpeech(400,425,pickLine(NPC_LINES.petShopOwner));playTalkSound();return;
    }
    // Stand click
    PET_STANDS.forEach((stand,i)=>{
      const sp=SHOP_PETS[i];if(!sp)return;
      if(Math.abs(mx-stand.x)<55&&my>stand.y-85&&my<stand.y+60){
        if(mx>stand.x-32&&mx<stand.x+32&&my>stand.y+32&&my<stand.y+56){
          // adopt button
          pet={type:sp.type,color:sp.color,x:char.x-30,y:char.y};
          notify('Adopted '+sp.type+'! 🐾');
        }
      }
    });
    char.tx=mx;char.ty=Math.min(Math.max(my,60),H-30);
  } else if(scene==='theater'){
    // Left arrow
    if(mx>88&&mx<130&&my>190&&my<245){theaterSlide=(theaterSlide-1+MOVIES.length)%MOVIES.length;return;}
    // Right arrow
    if(mx>670&&mx<712&&my>190&&my<245){theaterSlide=(theaterSlide+1)%MOVIES.length;return;}
    char.tx=mx;char.ty=Math.min(Math.max(my,60),H-100);
  } else if(scene==='mall'){
    // Clothes shop
    if(mx>30&&mx<210&&my>100&&my<420){
      // Clothes shopkeeper at ~x=120 y=120
      if(mx>70&&mx<170&&my>90&&my<170){showSpeech(120,120,pickLine(NPC_LINES.clothesShop));playTalkSound();return;}
      if(!document.getElementById('custPanel'))createCustomizerPanel();notify('Try on some clothes! 👗');return;
    }
    // Toy shop
    if(mx>310&&mx<490&&my>100&&my<420){
      // Toy shopkeeper at ~x=400 y=120
      if(mx>350&&mx<450&&my>90&&my<170){showSpeech(400,120,pickLine(NPC_LINES.toyShop));playTalkSound();return;}
      const toys=['🧸','🎮','🪀','🎯','🎪','🎨','🧩','🪁'];
      toyFloats.push({x:mx,y:my,emoji:toys[Math.floor(Math.random()*toys.length)],life:60});
      notify('Got a toy! 🧸');return;
    }
    // Food court
    FOOD_STANDS.forEach(fs=>{
      if(Math.abs(mx-fs.x)<30&&my>340&&my<400){
        playTone(440,'sine',0.1);playTone(550,'sine',0.1);
        for(let k=0;k<4;k++)foodSparkles.push({x:mx+Math.random()*40-20,y:my+Math.random()*20-10,life:20});
        notify('Nom nom! 😋');
      }
    });
    char.tx=mx;char.ty=Math.min(Math.max(my,60),H-30);
  } else if(scene==='haunted'){
    // Ghosts
    for(let g of ghosts){
      if(Math.abs(mx-g.x)<34&&Math.abs(my-g.y)<34){
        if(!g.found){g.found=true;playTone(200,'sawtooth',0.3,0.1,100);}
        showSpeech(g.x,g.y-20,pickLine(NPC_LINES.ghost));playTalkSound();return;
      }
    }
    char.tx=mx;char.ty=Math.min(Math.max(my,60),H-30);
  }
}

// ─── GAME LOOP ────────────────────────────────────────────────────────────────
function update(){
  // move char
  const dx=char.tx-char.x,dy=char.ty-char.y;
  const dist=Math.sqrt(dx*dx+dy*dy);
  if(dist>4){
    char.facing=dx>0?1:-1;
    char.moving=true;
    char.x+=dx/dist*4.5;char.y+=dy/dist*4.5;
    char.step+=0.2;
  } else {char.moving=false;}
  // pet follow
  if(pet){
    const px=char.x-30*char.facing,py=char.y;
    const pdx=px-pet.x,pdy=py-pet.y;
    const pdist=Math.sqrt(pdx*pdx+pdy*pdy);
    if(pdist>20){pet.x+=pdx/pdist*3.5;pet.y+=pdy/pdist*3.5;}
  }
  // drink hold progress (1 second hold = full drink)
  if(drinkHold){
    drinkHold.progress = Math.min(1,(Date.now()-drinkHold.startTime)/1000);
  }
  // music particles
  if(!muted&&frame%40===0)spawnMParticle();
  updateMParticles();
  frame++;
}

function drawScene(){
  if(scene==='town')drawTown();
  else if(scene==='home')drawHome();
  else if(scene==='boba')drawBoba();
  else if(scene==='sushi')drawSushi();
  else if(scene==='apartments')drawApartments();
  else if(scene==='petshop')drawPetShop();
  else if(scene==='mall')drawMall();
  else if(scene==='theater')drawTheater();
  else if(scene==='haunted')drawHaunted();
}

function drawCharacterWithBob(){
  // walking bob
  const bobY=char.moving?Math.sin(char.step)*3:0;
  ctx.save();ctx.translate(0,bobY);
  drawChar(char.x,char.y);
  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,W,H);
  drawScene();
  // World kokeshi dolls
  worldDolls.forEach(wd=>{
    drawKokeshi(wd.x,wd.y,KOKESHI_DEFS[wd.idx]);
  });
  // Hidden kokeshi spots (subtle)
  if(scene!=='town'){
    KOKESHI_HIDDEN.forEach((spot,i)=>{
      if(spot.scene===scene&&!kokeshiFound[i]){
        const reachable=!spot.requires||spot.requires();
        ctx.beginPath();ctx.arc(spot.x,spot.y,8,0,Math.PI*2);
        ctx.fillStyle=reachable?'rgba(255,220,80,0.22)':'rgba(180,180,180,0.10)';ctx.fill();
        if(reachable){
          ctx.font='13px Arial';ctx.textAlign='center';ctx.fillStyle='rgba(255,220,80,0.5)';
          ctx.fillText('✨',spot.x,spot.y+5);
        }
      }
    });
  }
  if(pet)drawPet(pet.x,pet.y,pet.type,pet.color);
  drawCharacterWithBob();
  drawMParticles();
  drawDrinkEffect();
  drawSpeechBubble();
}

function loop(){
  update();draw();
  requestAnimationFrame(loop);
}

// ── Cookie helpers ──────────────────────────────────────
function _setCookie(name, val, days=730) {
  const exp = new Date(Date.now() + days*864e5).toUTCString();
  document.cookie = name + '=' + encodeURIComponent(JSON.stringify(val)) + ';expires=' + exp + ';path=/';
}
function _getCookie(name) {
  const m = document.cookie.match('(?:^|; )' + name + '=([^;]*)');
  if (!m) return null;
  try { return JSON.parse(decodeURIComponent(m[1])); } catch(e) { return null; }
}
function _delCookie(name) {
  document.cookie = name + '=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/';
}

// ── Save all state ──────────────────────────────────────
function saveState() {
  // Character
  _setCookie('cl_char', {
    skin: char.skin, hair: char.hair, hairStyle: char.hairStyle,
    eyeColor: char.eyeColor, outfit: char.outfit,
    outfitColor: char.outfitColor, outfitColor2: char.outfitColor2,
    earrings: char.earrings, earringColor: char.earringColor
  });
  // Home
  _setCookie('cl_home', { wallColor, floorColor, furniture });
  // Boba cups (positions + customization)
  _setCookie('cl_boba', bobaCups.map(c => ({
    x: c.x, y: c.y, flavor: c.flavor, topping: c.topping, size: c.size
  })));
  // Apartments
  _setCookie('cl_apts', APT_DOORS.map(d => ({ open: d.open })));
  _setCookie('cl_gifts', giftItems.map(g => ({ x: g.x, y: g.y, emoji: g.emoji })));
  // Sushi
  _setCookie('cl_sushi', {
    plates: conveyorPlates.map(p => ({ x: p.x, revealed: p.revealed, emoji: p.emoji })),
    chestOpen, bentoSlots
  });
  // Kokeshi
  _setCookie('cl_kokeshi', { found: kokeshiFound, worldDolls });
  // Pet
  _setCookie('cl_pet', pet ? { type: pet.type, color: pet.color } : null);
}

// Auto-save every 10 seconds
setInterval(saveState, 10000);

// Also save on page unload
window.addEventListener('beforeunload', saveState);

// ── Load all state ──────────────────────────────────────
function loadState() {
  const ch = _getCookie('cl_char');
  if (ch) Object.assign(char, ch);

  const ho = _getCookie('cl_home');
  if (ho) {
    if (ho.wallColor) wallColor = ho.wallColor;
    if (ho.floorColor) floorColor = ho.floorColor;
    if (Array.isArray(ho.furniture)) furniture = ho.furniture;
  }

  const bo = _getCookie('cl_boba');
  if (Array.isArray(bo) && bo.length > 0) bobaCups = bo;

  const ap = _getCookie('cl_apts');
  if (Array.isArray(ap)) {
    ap.forEach((saved, i) => { if (APT_DOORS[i]) APT_DOORS[i].open = saved.open; });
  }
  const gi = _getCookie('cl_gifts');
  if (Array.isArray(gi)) giftItems = gi;

  const su = _getCookie('cl_sushi');
  if (su) {
    if (su.chestOpen !== undefined) chestOpen = su.chestOpen;
    if (Array.isArray(su.bentoSlots)) bentoSlots = su.bentoSlots;
  }

  const ko = _getCookie('cl_kokeshi');
  if (ko) {
    if (Array.isArray(ko.found)) kokeshiFound = ko.found;
    if (Array.isArray(ko.worldDolls)) worldDolls = ko.worldDolls;
  }

  const pe = _getCookie('cl_pet');
  if (pe && pe.type) pet = { type: pe.type, color: pe.color || '#FFB3D9', x: char.x + 40, y: char.y };
}

// ── Reset helpers ─────────────────────────────────────────
const RESET_DEFAULTS = {
  home: () => {
    wallColor = '#FFF0F8'; floorColor = '#D4A870';
    furniture = [
      {type:'bed',x:180,y:240,color:'#FFB3D9'},
      {type:'wardrobe',x:600,y:220,color:'#C4A882'},
      {type:'rug',x:350,y:390,color:'#FFD0A0'}
    ];
    _delCookie('cl_home');
    notify('Room reset! 🏠');
  },
  boba: () => {
    bobaCups = [
      {x:150,y:278,flavor:'strawberry',topping:'boba',size:'M'},
      {x:265,y:278,flavor:'taro',topping:'boba',size:'L'},
      {x:380,y:278,flavor:'matcha',topping:'lychee',size:'M'}
    ];
    _delCookie('cl_boba');
    notify('Boba shop reset! ☕');
  },
  sushi: () => {
    conveyorPlates.forEach(p => { p.revealed = false; });
    chestOpen = false; chestEmoji = '';
    bentoSlots = [null,null,null,null];
    _delCookie('cl_sushi');
    notify('Sushi reset! 🍣');
  },
  apartments: () => {
    APT_DOORS.forEach(d => { d.open = false; });
    giftItems = [
      {x:100,y:440,emoji:'🎵'},{x:160,y:440,emoji:'🎀'},
      {x:220,y:440,emoji:'📚'},{x:280,y:440,emoji:'🌟'},
      {x:340,y:440,emoji:'🌻'},{x:400,y:440,emoji:'🍰'}
    ];
    _delCookie('cl_apts');
    _delCookie('cl_gifts');
    notify('Apartments reset! 🏢');
  },
  petshop: () => {
    pet = null;
    _delCookie('cl_pet');
    notify('Pet released 💔');
  },
  mall: () => { toyFloats = []; foodSparkles = []; notify('Mall reset! 🛍️'); },
  theater: () => { theaterSlide=0; notify('Theater reset! 🎬'); },
  haunted: () => { ghosts.forEach(g => { g.found = false; }); notify('Ghosts are back! 👻'); },
};

// ── Draw reset button (call from each scene draw fn) ──────
function drawResetBtn() {
  if (scene === 'town') return;
  const rx = 105, ry = 12;
  // pill background
  ctx.fillStyle = 'rgba(255,255,255,0.88)';
  ctx.beginPath();
  ctx.roundRect(rx, ry, 76, 26, 13);
  ctx.fill();
  ctx.strokeStyle = '#FFB3D9'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.roundRect(rx, ry, 76, 26, 13); ctx.stroke();
  ctx.font = 'bold 11px Segoe UI'; ctx.fillStyle = '#C060A0'; ctx.textAlign = 'center';
  ctx.fillText('🔄 Reset', rx + 38, ry + 17);
}

// ── Handle reset button click ─────────────────────────────
function checkResetClick(mx, my) {
  if (scene === 'town') return false;
  if (mx >= 105 && mx <= 181 && my >= 12 && my <= 38) {
    const fn = RESET_DEFAULTS[scene];
    if (fn) fn();
    saveState();
    return true;
  }
  return false;
}

// ── Patch the existing click handler to check reset first ─
const _origHandleClick = typeof handleClick === 'function' ? handleClick : null;
// Wrap canvas click — find the existing mouseup/click listener and pre-check reset
const _origCanvas = canvas;
// Reset button check is now handled inside handleClick() directly
// (pointerUp calls handleClick which calls checkResetClick first)

// ── draw() already calls drawSpeechBubble(); add reset btn directly ──────────
// Patch: redefine loop to include drawResetBtn
cancelAnimationFrame(window._rafId);
function loop() {
  update();
  draw();
  drawResetBtn();
  window._rafId = requestAnimationFrame(loop);
}
window._rafId = requestAnimationFrame(loop);

// ── Load on startup ────────────────────────────────────────
loadState();
notify('Welcome back! ✨  (Your progress was saved)');

</script>
